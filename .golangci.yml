version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - unconvert
    - unparam
    - gocritic

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance

  exclusions:
    rules:
      # Exclude some linters from running on test files
      - path: _test\.go
        linters:
          - unparam
          - gocritic

      # Exclude generated files
      - path: ".*\\.pb\\.go"
        linters:
          - all

      - path: ".*_bpfel\\.go"
        linters:
          - all

      - path: ".*_bpfeb\\.go"
        linters:
          - all

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/spinningfactory/kloak
