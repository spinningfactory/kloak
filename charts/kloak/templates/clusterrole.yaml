apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kloak-controller
  labels:
    {{- include "kloak.labels" . | nindent 4 }}
rules:
  # Pod watching for controller
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Secret management for SecretReconciler
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Namespace reading for webhook enablement inheritance
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # Workload reading for webhook enablement inheritance (pod -> owner chain)
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  # Events for debugging
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # MutatingWebhookConfiguration for cert management
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations"]
    verbs: ["get", "update", "patch"]
