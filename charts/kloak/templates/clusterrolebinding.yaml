apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kloak-controller
  labels:
    {{- include "kloak.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kloak-controller
subjects:
  - kind: ServiceAccount
    name: kloak-controller
    namespace: {{ .Release.Namespace }}
