apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: kloak-mutating-webhook
  labels:
    {{- include "kloak.labels" . | nindent 4 }}
webhooks:
  - name: pod.mutate.getkloak.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    clientConfig:
      service:
        namespace: {{ .Release.Namespace }}
        name: kloak-webhook
        path: /mutate-pods
      # caBundle is patched automatically by the controller on startup
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
    namespaceSelector:
      matchExpressions:
        - key: getkloak.io/enabled
          operator: In
          values: ["true"]
    failurePolicy: Fail
