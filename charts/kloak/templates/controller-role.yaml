{{- if and .Values.controller.ebpf.enabled .Values.controller.ebpf.persist }}
# A controller reports on its own pod (condition getkloak.io/Uninstalled)
# that it tore its node's eBPF data plane down for an uninstall, which the
# pre-delete hook waits for. Only in the release's namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kloak-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kloak.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kloak-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kloak.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kloak-controller
subjects:
  - kind: ServiceAccount
    name: kloak-controller
    namespace: {{ .Release.Namespace }}
{{- end }}
