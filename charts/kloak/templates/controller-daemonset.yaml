apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kloak-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kloak.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  selector:
    matchLabels:
      {{- include "kloak.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "kloak.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: kloak-controller
      hostPID: true
      # 60s gives the controller-runtime manager time to finish its shutdown
      # path (uprobe detach, BPF program close) on SIGTERM, so Go's coverage
      # runtime can flush covcounters before kubelet SIGKILLs the pod. The
      # default 30s was racing the cleanup and producing covmeta-only
      # artifacts in CI.
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: mount-tracefs
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "mount -t tracefs tracefs /sys/kernel/tracing 2>/dev/null || true"]
          securityContext:
            privileged: true
          volumeMounts:
            - name: tracefs
              mountPath: /sys/kernel/tracing
              mountPropagation: Bidirectional
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/kloak", "controller"]
          args:
            - --enable-ebpf={{ .Values.controller.ebpf.enabled }}
            - --cgroup-path={{ .Values.controller.cgroupPath }}
            {{- if .Values.controller.dns.trustedServers }}
            - --trusted-dns-servers={{ join "," .Values.controller.dns.trustedServers }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KLOAK_LOG_LEVEL
              value: {{ .Values.log.level | quote }}
            - name: KLOAK_LOG_DEV
              value: {{ .Values.log.dev | quote }}
            {{- if .Values.coverage.enabled }}
            - name: GOCOVERDIR
              value: /coverage
            {{- end }}
          ports:
            - name: health
              containerPort: 8081
          volumeMounts:
            - name: cgroup
              mountPath: /host/sys/fs/cgroup
              readOnly: false
            - name: bpf
              mountPath: /sys/fs/bpf
              readOnly: false
            - name: btf
              mountPath: /sys/kernel/btf
              readOnly: true
            - name: tracefs
              mountPath: /sys/kernel/tracing
              mountPropagation: Bidirectional
            {{- if .Values.coverage.enabled }}
            - name: coverage
              mountPath: /coverage
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
            appArmorProfile:
              type: Unconfined
            capabilities:
              add:
                - BPF
                - NET_ADMIN
                - SYS_ADMIN
                - SYS_RESOURCE
      volumes:
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: bpf
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: btf
          hostPath:
            path: /sys/kernel/btf
            type: Directory
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
            type: DirectoryOrCreate
        {{- if .Values.coverage.enabled }}
        - name: coverage
          hostPath:
            path: {{ .Values.coverage.hostPath }}
            type: DirectoryOrCreate
        {{- end }}
