image:
  repository: kloak
  tag: latest
  pullPolicy: IfNotPresent

controller:
  ebpf:
    enabled: true
  cgroupPath: /host/sys/fs/cgroup
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi

webhook:
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi

certificates:
  mode: auto  # auto | certManager | provided
  provided:
    secretName: kloak-webhook-certs
    certKey: tls.crt
    keyKey: tls.key
  certManager:
    issuerRef:
      name: kloak-selfsigned
      kind: Issuer

coverage:
  enabled: false
  hostPath: /tmp/kloak-coverage
