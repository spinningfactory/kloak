# Install: helm install kloak oci://ghcr.io/spinningfactory/kloak/kloak -n kloak-system --create-namespace
# With demo: helm install kloak oci://ghcr.io/spinningfactory/kloak/kloak -n kloak-system --create-namespace --set demo.enabled=true

image:
  repository: ghcr.io/spinningfactory/kloak
  tag: dev
  pullPolicy: IfNotPresent

log:
  # Log level: trace, debug, info, warn, error
  # trace: very verbose (per-secret sync, BPF debug counters)
  # debug: per-process attach, exec events, retry details
  level: info
  # Development mode: human-readable console output with colors
  dev: false
  # Verifier-log level for BPF program loads. Empty / disabled keeps the
  # 1 MB-per-program log buffer from being allocated proactively at startup
  # (cilium/ebpf still retries with branch logging on verifier failure, so
  # diagnostics remain available on the only path that needs them). Setting
  # this to "branch" / "instruction" / "stats" — or a comma-separated
  # combination — opts into proactive logging during program load. Useful
  # for offline complexity analysis; not recommended in production.
  ebpfLevel: ""

controller:
  ebpf:
    enabled: true
    # Network interface for tc-egress attachment inside each tracked
    # netns. "auto" (default) reads /proc/net/route inside the netns
    # and picks the interface backing the default IPv4 route — works
    # for the standard CNI "eth0" convention AND for host-mode netns
    # where the default route exits via a non-standard name. Pin to a
    # specific name (e.g. "eth0", "wlp3s0", "enp0s3") to override.
    # Use "none" or "lo-only" to attach only to loopback (test fixtures
    # / loopback-only workloads). `lo` is always attached in addition
    # to whichever external interface this resolves to.
    egressInterface: auto
  cgroupPath: /host/sys/fs/cgroup
  dns:
    # Trusted DNS server IPs. Only DNS responses from these servers are used
    # for host-based secret filtering. If empty, auto-discovers kube-dns ClusterIP.
    trustedServers: []
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi

webhook:
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi

certificates:
  mode: auto  # auto | certManager | provided
  provided:
    secretName: kloak-webhook-certs
    certKey: tls.crt
    keyKey: tls.key
  certManager:
    issuerRef:
      name: kloak-selfsigned
      kind: Issuer

coverage:
  enabled: false
  hostPath: /tmp/kloak-coverage

# Optional demo app deployment for validating kloak is working.
# Enable with: helm install kloak charts/kloak --set demo.enabled=true
#
# Deploys a Go app that sends two secrets to httpbin.org as headers.
# DNS host filtering (via kube-dns, auto-discovered) verifies that
# secrets are only rewritten for their allowed hosts:
#   - "allowed" secret (hosts: httpbin.org) → real value in response
#   - "blocked" secret (hosts: example.com) → shadow UUID in response
demo:
  enabled: false
  # Namespace for the demo app. Created automatically with the
  # getkloak.io/enabled label so the webhook intercepts pods in it.
  namespace: kloak-demo
  image:
    repository: ghcr.io/spinningfactory/kloak-demo-go
    # Empty tag defaults to chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  # Target URL that the demo app sends requests to (must be HTTPS).
  targetURL: "https://httpbin.org/headers"
  # Interval in seconds between requests.
  requestInterval: "5"
  # Allowed secret: host matches targetURL → kloak rewrites with real value.
  secretAllowed:
    value: "real-api-key-allowed-12345"
    allowedHost: "httpbin.org"
  # Blocked secret: host does NOT match targetURL → shadow UUID passes through.
  secretBlocked:
    value: "real-api-key-blocked-67890"
    allowedHost: "example.com"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
