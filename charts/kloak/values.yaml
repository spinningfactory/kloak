image:
  repository: ghcr.io/spinningfactory/kloak
  tag: dev
  pullPolicy: IfNotPresent

log:
  # Log level: debug, info, warn, error
  level: info
  # Development mode: human-readable console output with colors
  dev: false

controller:
  ebpf:
    enabled: true
  cgroupPath: /host/sys/fs/cgroup
  dns:
    # Trusted DNS server IPs. Only DNS responses from these servers are used
    # for host-based secret filtering. If empty, auto-discovers kube-dns ClusterIP.
    trustedServers: []
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi

webhook:
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi

certificates:
  mode: auto  # auto | certManager | provided
  provided:
    secretName: kloak-webhook-certs
    certKey: tls.crt
    keyKey: tls.key
  certManager:
    issuerRef:
      name: kloak-selfsigned
      kind: Issuer

coverage:
  enabled: false
  hostPath: /tmp/kloak-coverage
