version: 2
updates:
  # Go modules
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    reviewers:
      - dhiaayachi
    labels:
      - dependencies
    open-pull-requests-limit: 10

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    reviewers:
      - dhiaayachi
    labels:
      - dependencies
      - ci

  # Docker (Dockerfile base images)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    reviewers:
      - dhiaayachi
    labels:
      - dependencies
