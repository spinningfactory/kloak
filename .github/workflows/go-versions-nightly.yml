name: Go Versions Nightly

# Three things on a Go-version cadence, in one workflow:
#
#   1. discover  — rebuild offset JSONs for every supported (Go, arch) cell
#                  and diff against the committed `tools/go-tls-offsets/results/`.
#                  Catches mid-week struct-layout drift in patch releases.
#   2. e2e       — exercise demo-go end-to-end against every supported Go.
#                  Catches BPF-interaction regressions that the unit tests
#                  (which only check offset arithmetic vs DWARF) cannot see.
#   3. watcher   — query go.dev for newly-released minor versions, run discovery
#                  + table updates for them, open a Dependabot-style PR.
#
# Runs daily at 06:00 UTC. Manual triggers via workflow_dispatch are also
# supported. fail-fast: false everywhere — one matrix cell flaking should not
# mask the others' results.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: go-versions-nightly
  cancel-in-progress: false

env:
  GO_VERSION: '1.26'

jobs:
  # ────────────────────────────────────────────────────────────────────
  # (1) Offset discovery — same shape as go-tls-offsets.yml's matrix, but
  # diffs are surfaced and any drift is uploaded as an artifact.
  discover:
    name: Discover ${{ matrix.go }} on ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        go: ["1.20", "1.21", "1.22", "1.23", "1.24", "1.25", "1.26"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute arch label
        id: arch
        run: |
          case "${{ matrix.platform }}" in
            linux/amd64) echo "arch=amd64" >> "$GITHUB_OUTPUT" ;;
            linux/arm64) echo "arch=arm64" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build discovery image
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --build-arg GO_VERSION=${{ matrix.go }} \
            --load \
            -t go-tls-offsets:${{ matrix.go }}-${{ steps.arch.outputs.arch }} \
            tools/go-tls-offsets/

      - name: Run discovery
        run: |
          mkdir -p out
          docker run --rm --platform ${{ matrix.platform }} \
            go-tls-offsets:${{ matrix.go }}-${{ steps.arch.outputs.arch }} \
            > out/go-${{ matrix.go }}-${{ steps.arch.outputs.arch }}.json
          echo "=== discovered ==="
          cat out/go-${{ matrix.go }}-${{ steps.arch.outputs.arch }}.json

      - name: Diff against committed JSON
        run: |
          existing=tools/go-tls-offsets/results/go-${{ matrix.go }}-${{ steps.arch.outputs.arch }}.json
          new=out/go-${{ matrix.go }}-${{ steps.arch.outputs.arch }}.json
          if [ ! -f "$existing" ]; then
            echo "::warning::no committed reference for Go ${{ matrix.go }} ${{ steps.arch.outputs.arch }}"
            exit 0
          fi
          # jq -S normalizes key order/whitespace.
          if ! diff <(jq -S . "$existing") <(jq -S . "$new"); then
            echo "::warning::offsets drifted for Go ${{ matrix.go }} ${{ steps.arch.outputs.arch }} — review the artifact"
          fi

      - name: Upload result
        uses: actions/upload-artifact@v7
        with:
          name: go-tls-offsets-${{ matrix.go }}-${{ steps.arch.outputs.arch }}
          path: out/go-${{ matrix.go }}-${{ steps.arch.outputs.arch }}.json
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────
  # (2) Multi-version e2e — exercises the real BPF rewrite path against a
  # demo-go binary built with each supported Go version.
  e2e:
    name: e2e Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    needs: [discover]
    strategy:
      fail-fast: false
      matrix:
        go: ["1.20", "1.21", "1.22", "1.23", "1.24", "1.25", "1.26"]
    permissions:
      contents: read
      packages: write
    env:
      CACHE_REPO: ghcr.io/${{ github.repository }}/cache
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install clang and bpftool for eBPF
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev
          KVER="$(uname -r)" && sudo apt-get install -y linux-tools-common "linux-tools-${KVER}" 2>/dev/null || true

      - name: Generate eBPF bindings
        run: KLOAK_TARGET_ARCH=x86 go generate ./pkg/ebpf/

      - name: Login to GHCR (for build cache)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install k3s
        run: |
          curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--write-kubeconfig-mode 644 --disable=traefik" sh -
          for i in $(seq 1 30); do
            sudo k3s kubectl get nodes -o name 2>/dev/null | grep -q . && break
            sleep 2
          done
          sudo k3s kubectl wait --for=condition=Ready node --all --timeout=120s
          mkdir -p ~/.kube
          sudo cp /etc/rancher/k3s/k3s.yaml ~/.kube/k3s-e2e.yaml
          sudo chown "$(id -u):$(id -g)" ~/.kube/k3s-e2e.yaml
          chmod 600 ~/.kube/k3s-e2e.yaml

      - name: Build kloak + demo-go (for Go ${{ matrix.go }}) and import to k3s
        run: |
          # Per-version cache key so demo-go layers don't thrash across cells.
          CACHE=${{ env.CACHE_REPO }}

          docker buildx build --load \
            --cache-from type=registry,ref=${CACHE}:kloak \
            --cache-to type=registry,ref=${CACHE}:kloak,mode=max,ignore-error=true \
            --build-arg TARGETARCH=amd64 --build-arg COVER=1 --build-arg BPF_DEBUG=1 \
            -t kloak:e2e .

          docker buildx build --load \
            --build-arg GO_VERSION=${{ matrix.go }} \
            --cache-from type=registry,ref=${CACHE}:demo-go-${{ matrix.go }} \
            --cache-to type=registry,ref=${CACHE}:demo-go-${{ matrix.go }},mode=max,ignore-error=true \
            -t kloak-demo-go:latest ./examples/demo-go/

          # In-cluster HTTPS echo server: the Go e2e retargets demo-go at this
          # instead of the public httpbin.org, which was the dominant flake
          # source for this nightly (see test/e2e/http-echo-server).
          docker buildx build --load \
            --cache-from type=registry,ref=${CACHE}:http-echo \
            --cache-to type=registry,ref=${CACHE}:http-echo,mode=max,ignore-error=true \
            -t kloak-http-echo:latest ./test/e2e/http-echo-server/

          docker save kloak:e2e kloak-demo-go:latest kloak-http-echo:latest \
            | sudo k3s ctr -n k8s.io images import -

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Start BPF trace capture
        run: |
          sudo touch /tmp/bpf-trace.log
          sudo chmod 666 /tmp/bpf-trace.log
          sudo nohup sh -c 'cat /sys/kernel/tracing/trace_pipe > /tmp/bpf-trace.log 2>&1' >/dev/null 2>&1 &
          echo $! | sudo tee /tmp/bpf-trace.pid >/dev/null
          sleep 1

      - name: Run TestEBPFSecretRewrite/go
        run: go test -v -timeout 600s -tags=e2e_ebpf -count=1 -run 'TestEBPFSecretRewrite/go$' ./test/e2e/
        env:
          KUBECONFIG: /home/runner/.kube/k3s-e2e.yaml

      - name: Stop BPF trace capture
        if: always()
        run: |
          PID=$(cat /tmp/bpf-trace.pid 2>/dev/null) || true
          if [ -n "$PID" ]; then
            sudo kill "$PID" 2>/dev/null || true
          fi
          sudo pkill -f "cat /sys/kernel/tracing/trace_pipe" 2>/dev/null || true
          sudo chmod 666 /tmp/bpf-trace.log 2>/dev/null || true

      - name: Collect logs and BPF debug info on failure
        if: failure()
        env:
          KUBECONFIG: /home/runner/.kube/k3s-e2e.yaml
        run: |
          echo "=== Kloak Controller Logs ==="
          kubectl logs -n kloak-system -l app.kubernetes.io/component=controller --tail=5000 2>/dev/null || true
          echo "=== demo-go Logs ==="
          kubectl logs -n kloak-e2e -l app=demo-go --tail=200 2>/dev/null || true
          echo "=== BPF trace (last 500 lines) ==="
          if [ -s /tmp/bpf-trace.log ]; then
            grep -F kloak /tmp/bpf-trace.log | tail -500 || true
          fi

      - name: Upload BPF trace
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bpf-trace-go-${{ matrix.go }}
          path: /tmp/bpf-trace.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop k3s
        if: always()
        run: |
          sudo /usr/local/bin/k3s-killall.sh 2>/dev/null || true
          sudo /usr/local/bin/k3s-uninstall.sh 2>/dev/null || true
          rm -f ~/.kube/k3s-e2e.yaml

  # ────────────────────────────────────────────────────────────────────
  # (3) New-version watcher — diffs go.dev's release feed against the
  # JSONs we currently track. New minor releases trigger a discovery
  # build + apply-new-versions.sh + auto-PR.
  detect-new-version:
    name: Detect new Go versions
    runs-on: ubuntu-latest
    needs: [discover]
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The PR edits .github/workflows/go-tls-offsets.yml and this workflow
      # itself, and GitHub refuses to let the default GITHUB_TOKEN push changes
      # to workflow files (needs the `workflow` scope, which GITHUB_TOKEN cannot
      # have). So both the checkout and the PR creation use AUTOMATION_PAT — a
      # PAT (or GitHub App token) with `repo` + `workflow` scopes, stored as a
      # repo secret. See the "Open PR" step below.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.AUTOMATION_PAT }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Find new minor versions
        id: find
        run: |
          set -euo pipefail
          # Latest stable per minor from go.dev. `comm` (used below) requires
          # both inputs to be sorted in the SAME collation, and `LC_ALL=C
          # sort -u` is comm's contract. Don't use `sort -V` here — that's
          # version-aware (1.2 before 1.10), but `comm` is lex-aware (1.10
          # before 1.2), and mixing them causes `comm: not in sorted order`.
          # We only need set membership for the diff; ordering doesn't matter
          # to the downstream awk filter.
          curl -fsS "https://go.dev/dl/?mode=json&include=all" \
            | jq -r '.[] | select(.stable) | .version' \
            | sed 's/^go//' \
            | awk -F. '{ printf "%d.%d\n", $1, $2 }' \
            | LC_ALL=C sort -u > upstream-minors.txt

          ls tools/go-tls-offsets/results/ \
            | sed -n 's/^go-\([0-9]*\.[0-9]*\)-amd64\.json$/\1/p' \
            | LC_ALL=C sort -u > tracked-minors.txt

          # MIN_VERSION mirrors the floor used by build-fixtures.sh — anything
          # older than that is intentionally unsupported, not "new".
          MIN_VERSION="1.20"
          LC_ALL=C comm -23 upstream-minors.txt tracked-minors.txt \
            | awk -v m="$MIN_VERSION" -F. '{ cur = $1 + $2/100; lim = (split(m, mm, ".") ? mm[1] + mm[2]/100 : 0); if (cur >= lim) print }' \
            > new-minors.txt

          if [ -s new-minors.txt ]; then
            new=$(paste -sd, new-minors.txt)
            echo "new=$new" >> "$GITHUB_OUTPUT"
            echo "Found new Go versions: $new"
          else
            echo "new=" >> "$GITHUB_OUTPUT"
            echo "No new Go versions detected"
          fi

      - name: Discover offsets for each new version
        if: steps.find.outputs.new != ''
        run: |
          set -euo pipefail
          for v in $(echo "${{ steps.find.outputs.new }}" | tr ',' ' '); do
            for arch_pair in "linux/amd64:amd64" "linux/arm64:arm64"; do
              platform="${arch_pair%%:*}"
              arch="${arch_pair##*:}"
              docker buildx build --platform "$platform" \
                --build-arg GO_VERSION="$v" \
                --load -t "go-tls-offsets:$v-$arch" tools/go-tls-offsets/
              docker run --rm --platform "$platform" "go-tls-offsets:$v-$arch" \
                > "tools/go-tls-offsets/results/go-$v-$arch.json"
            done
          done

      - name: Patch table + workflow matrices
        if: steps.find.outputs.new != ''
        run: |
          tools/go-tls-offsets/apply-new-versions.sh "${{ steps.find.outputs.new }}"

      - name: Open PR
        if: steps.find.outputs.new != ''
        uses: peter-evans/create-pull-request@v8
        with:
          # PAT/App token with `repo` + `workflow` scopes. Required because the
          # PR edits .github/workflows/go-tls-offsets.yml and
          # .github/workflows/go-versions-nightly.yml, which the default
          # GITHUB_TOKEN is forbidden from pushing.
          token: ${{ secrets.AUTOMATION_PAT }}
          # Only commit the intended artifacts. The "Find new minor versions"
          # step writes scratch files (upstream-minors.txt, tracked-minors.txt,
          # new-minors.txt) to the repo root; without this, create-pull-request
          # sweeps them into the PR via `git add -A`.
          add-paths: |
            tools/go-tls-offsets/results
            pkg/ebpf/go_tls_offsets.go
            .github/workflows/go-tls-offsets.yml
            .github/workflows/go-versions-nightly.yml
          commit-message: "chore(go): add offset support for Go ${{ steps.find.outputs.new }}"
          branch: auto/go-versions/${{ steps.find.outputs.new }}
          delete-branch: true
          title: "chore(go): add offset support for Go ${{ steps.find.outputs.new }}"
          labels: |
            automated
            go-versions
          body: |
            Automated by `.github/workflows/go-versions-nightly.yml`.

            New Go release(s) detected on go.dev: **${{ steps.find.outputs.new }}**.

            Changes in this PR:
            - New `tools/go-tls-offsets/results/go-<v>-<arch>.json` per (version, arch).
            - New `goTLSOffsetTableBase` entries in `pkg/ebpf/go_tls_offsets.go`.
            - Updated matrix lists in `.github/workflows/go-tls-offsets.yml` and `.github/workflows/go-versions-nightly.yml`.

            ### Reviewer checklist
            - [ ] Diff the JSONs — offsets in expected ranges, no `notes:` field set.
            - [ ] `go test ./pkg/ebpf -run TestGoTLSOffsets` passes locally.
            - [ ] Spot-check that the on-demand `go-tls-offsets.yml` workflow's matrix matches.
