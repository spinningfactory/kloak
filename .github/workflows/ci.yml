name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install clang for eBPF generation
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev

      - name: Generate eBPF bindings
        run: KLOAK_TARGET_ARCH=x86 go generate ./pkg/ebpf/

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.4
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install clang for eBPF generation
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev

      - name: Generate eBPF bindings
        run: KLOAK_TARGET_ARCH=x86 go generate ./pkg/ebpf/

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        run: go build -v -o bin/kloak ./cmd/kloak

      - name: Upload binary
        uses: actions/upload-artifact@v5
        with:
          name: kloak-binary
          path: bin/kloak
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install clang for eBPF generation
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev

      - name: Generate eBPF bindings
        run: KLOAK_TARGET_ARCH=x86 go generate ./pkg/ebpf/

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out $(go list ./... | grep -v -E '/test/e2e|/cmd/|/pkg/ebpf|/pkg/cgroups')

      - name: Upload coverage
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  coverage:
    name: Coverage Report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: fgrosse/go-coverage-report@v1.3.0
        with:
          coverage-artifact-name: coverage
          coverage-file-name: coverage.out

  coverage-badge:
    name: Coverage Badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install clang for eBPF generation
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev

      - name: Generate eBPF bindings
        run: KLOAK_TARGET_ARCH=x86 go generate ./pkg/ebpf/

      - name: Run tests with coverage
        run: |
          go test -coverprofile=coverage.out $(go list ./... | grep -v -E '/test/e2e|/cmd/|/pkg/ebpf|/pkg/cgroups')
          go tool cover -func=coverage.out -o=coverage.out

      - name: Update coverage badge
        uses: tj-actions/coverage-badge-go@v3
        with:
          filename: coverage.out

      - name: Verify changed files
        uses: tj-actions/verify-changed-files@v16
        id: verify-changed-files
        with:
          files: README.md

      - name: Commit coverage badge
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git commit -m "chore: update coverage badge"
          git push

  docker:
    name: Docker Build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint, build, test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU (for arm64 final stage)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Create k3d cluster (with BPF mounts)
        run: |
          k3d cluster create kloak-e2e --wait --timeout 120s \
            --volume /sys/kernel/btf:/sys/kernel/btf:ro@server:0 \
            --volume /sys/fs/bpf:/sys/fs/bpf:rw@server:0
          k3d kubeconfig get kloak-e2e > /tmp/kubeconfig-e2e.yaml

      - name: Build and import images into k3d
        run: |
          docker build --build-arg TARGETARCH=amd64 --build-arg COVER=1 -t kloak:e2e .
          k3d image import kloak:e2e -c kloak-e2e
          docker build -t kloak-demo-go:latest ./examples/demo-go/
          docker build -t kloak-demo-python:latest ./examples/demo-python/
          docker build -t kloak-demo-js:latest ./examples/demo-js/
          k3d image import kloak-demo-go:latest kloak-demo-python:latest kloak-demo-js:latest -c kloak-e2e
          docker pull bitnami/kubectl:latest
          k3d image import bitnami/kubectl:latest -c kloak-e2e

      - name: Run E2E tests (with eBPF)
        run: go test -v -timeout 900s -tags=e2e_ebpf -count=1 ./test/e2e/
        env:
          KUBECONFIG: /tmp/kubeconfig-e2e.yaml

      - name: Collect e2e coverage from controller pod
        if: always()
        env:
          KUBECONFIG: /tmp/kubeconfig-e2e.yaml
        run: |
          mkdir -p /tmp/e2e-coverage
          # Send SIGTERM to controller to flush coverage data, then copy it out
          CTRL_POD=$(kubectl get pods -n kloak-system -l app.kubernetes.io/component=controller -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$CTRL_POD" ]; then
            # SIGTERM triggers graceful shutdown, which flushes GOCOVERDIR
            kubectl exec -n kloak-system "$CTRL_POD" -- kill -TERM 1 2>/dev/null || true
            sleep 5
            kubectl cp "kloak-system/$CTRL_POD:/tmp/coverage" /tmp/e2e-coverage/ 2>/dev/null || true
          fi
          echo "E2E coverage files:"
          ls -la /tmp/e2e-coverage/ 2>/dev/null || echo "No coverage files collected"

      - name: Merge unit and e2e coverage
        if: always()
        run: |
          mkdir -p /tmp/merged-coverage
          # Download unit test coverage artifact
          # Convert unit test coverage.out to covdata format
          if [ -f /tmp/unit-coverage/coverage.out ]; then
            mkdir -p /tmp/unit-covdata
            go tool covdata textfmt -i=/tmp/unit-coverage -o=/dev/null 2>/dev/null || true
          fi
          # Convert e2e covdata files to text format and merge
          if ls /tmp/e2e-coverage/covcounters.* 1>/dev/null 2>&1; then
            go tool covdata textfmt -i=/tmp/e2e-coverage -o=/tmp/e2e-coverage.out 2>/dev/null || true
            echo "E2E coverage generated"
          fi
          # Use the e2e coverage as additional coverage data
          # The unit coverage is already uploaded separately
          if [ -f /tmp/e2e-coverage.out ]; then
            cp /tmp/e2e-coverage.out /tmp/merged-coverage/e2e-coverage.out
          fi

      - name: Upload e2e coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-coverage
          path: /tmp/e2e-coverage.out
          retention-days: 7
          if-no-files-found: ignore

      - name: Collect logs on failure
        if: failure()
        env:
          KUBECONFIG: /tmp/kubeconfig-e2e.yaml
        run: |
          echo "=== Kloak Controller Logs ==="
          kubectl logs -n kloak-system -l app.kubernetes.io/component=controller --tail=200 2>/dev/null || true
          echo "=== Kloak Webhook Logs ==="
          kubectl logs -n kloak-system -l app.kubernetes.io/component=webhook --tail=100 2>/dev/null || true
          echo "=== Demo Go Logs ==="
          kubectl logs -n kloak-e2e -l app=demo-go --tail=50 2>/dev/null || true
          echo "=== Demo Python Logs ==="
          kubectl logs -n kloak-e2e -l app=demo-python --tail=50 2>/dev/null || true
          echo "=== Demo JS Logs ==="
          kubectl logs -n kloak-e2e -l app=demo-js --tail=50 2>/dev/null || true
          echo "=== All Pods ==="
          kubectl get pods -A 2>/dev/null || true
          echo "=== Events ==="
          kubectl get events -n kloak-e2e --sort-by='.lastTimestamp' 2>/dev/null || true
          echo "=== Describe Controller ==="
          kubectl describe daemonset -n kloak-system kloak-controller 2>/dev/null || true

      - name: Delete k3d cluster
        if: always()
        run: k3d cluster delete kloak-e2e
