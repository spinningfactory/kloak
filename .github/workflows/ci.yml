name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Must match the golang image in the Dockerfile (enforced by the
  # "Check Go version matches Dockerfile" step below). Unit coverage is
  # produced by this toolchain and e2e coverage by the image's; different
  # Go releases pick different coverage block boundaries, which breaks the
  # unit + e2e merge and makes the reported percentage far too low.
  GO_VERSION: '1.27'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true


jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check Go version matches Dockerfile
        # The shipped (and e2e) binary is built by the Dockerfile's golang
        # image; every workflow's GO_VERSION must name the same release so
        # tests run on the toolchain we ship and unit + e2e coverage merge.
        run: |
          DOCKER_GO=$(sed -nE 's/^FROM .*golang:([0-9]+\.[0-9]+).*/\1/p' Dockerfile | head -1)
          if [ -z "$DOCKER_GO" ]; then
            echo "::error file=Dockerfile::could not find the golang base image version"
            exit 1
          fi
          STATUS=0
          for f in .github/workflows/*.yml; do
            WF_GO=$(sed -nE "s/^  GO_VERSION: '?([0-9.]+)'?.*/\1/p" "$f")
            if [ -n "$WF_GO" ] && [ "$WF_GO" != "$DOCKER_GO" ]; then
              echo "::error file=$f::GO_VERSION is $WF_GO but the Dockerfile builds with golang:$DOCKER_GO; bump them together"
              STATUS=1
            fi
          done
          exit $STATUS

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install clang for eBPF generation
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev

      - name: Generate eBPF bindings
        run: KLOAK_TARGET_ARCH=x86 go generate ./pkg/ebpf/

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Must be built with a Go release >= GO_VERSION, otherwise it
          # panics with "file requires newer Go version".
          version: v2.14.0
          args: --timeout=5m

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Lint Helm chart
        run: helm lint charts/kloak

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install clang for eBPF generation
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev

      - name: Generate eBPF bindings
        run: KLOAK_TARGET_ARCH=x86 go generate ./pkg/ebpf/

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        run: go build -v -o bin/kloak ./cmd/kloak

      # Binary artifact skipped to save storage quota.

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install clang for eBPF generation
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev

      - name: Generate eBPF bindings
        run: KLOAK_TARGET_ARCH=x86 go generate ./pkg/ebpf/

      - name: Download dependencies
        run: go mod download

      - name: Run eBPF helper C tests
        run: make test-bpf-helpers

      - name: Run tests
        # Include pkg/ebpf (Linux-tagged BPF tests self-skip via t.Skipf when
        # eBPF resources aren't available on the runner) and pkg/cgroups (its
        # utils.go is pure parsing + the cgroup_linux/cgroup_other split takes
        # care of platform deps). cmd/kloak is included so its unit tests run;
        # its shutdown paths are also covered via the e2e binary. Exclude:
        #   - test/e2e      — separate job
        #   - cmd/ebpftest  — verifier-debugging CLI with no tests; Go would
        #                     still add it to the profile at 0%
        #   - tools/        — CLI utilities, coverage isn't meaningful
        run: go test -v -race -coverprofile=coverage.out $(go list ./... | grep -v -E '/test/e2e|/cmd/ebpftest|/tools/')

      - name: Upload unit coverage
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: coverage.out
          # 7 days so a single-job re-run of e2e (or coverage) within a week
          # still finds the artifact. 1 day was too tight — the e2e job often
          # gets re-run after a data-plane flake, hours or days later.
          retention-days: 7

  # Coverage Report runs on pull requests and comments a diff summary.
  # Depends on e2e so it can work against the merged unit + e2e profile.
  #
  # Skipped for pull requests originating from forks: GitHub strips
  # `pull-requests: write` from the GITHUB_TOKEN of fork PRs as a security
  # measure, regardless of the `permissions:` block below. The action
  # successfully downloads coverage and computes the diff but fails at the
  # final `gh pr comment` step with "Resource not accessible by integration
  # (addComment)" — turning a clean PR red for an issue the contributor
  # cannot fix. Same-repo PRs and pushes still get the coverage comment.
  coverage:
    name: Coverage Report
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    needs: [e2e]
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: fgrosse/go-coverage-report@v1.5.0
        with:
          coverage-artifact-name: combined-coverage
          coverage-file-name: combined-coverage.out

  # Coverage Badge updates a public gist that the README references via a
  # shields.io endpoint URL. This avoids committing to main on every push,
  # so branch protection on main can stay strict (no bypass required for
  # github-actions[bot]).
  #
  # Setup (one-time):
  #   - GIST_ID: hardcoded below — public gist owned by a maintainer.
  #   - GIST_TOKEN: repo secret, classic PAT with `gist` scope only.
  #     The PAT is tied to the gist owner. If that user leaves the org,
  #     the badge updates stop until a replacement PAT is configured.
  coverage-badge:
    name: Coverage Badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [e2e]
    steps:
      # `go tool cover -func` resolves the package paths in the coverage
      # profile (e.g. github.com/spinningfactory/kloak/cmd/kloak/main.go:9)
      # against go.mod, so the source tree must be present. Without checkout
      # the command fails with "go.mod file not found" and PCT becomes empty,
      # which falls through to color=red regardless of the real coverage.
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Download combined coverage
        uses: actions/download-artifact@v8
        with:
          name: combined-coverage
          path: /tmp/combined-coverage

      - name: Extract coverage percentage
        id: coverage
        run: |
          set -euo pipefail
          # `go tool cover -func` final line: "total: (statements) <pct>%"
          PCT=$(go tool cover -func=/tmp/combined-coverage/combined-coverage.out \
                | tail -1 | awk '{print $NF}' | sed 's/%//')
          if [ -z "$PCT" ]; then
            echo "::error::could not extract coverage percentage from combined-coverage.out"
            exit 1
          fi
          # Color thresholds match shields.io conventions.
          if   awk "BEGIN{exit !($PCT >= 85)}"; then COLOR=brightgreen
          elif awk "BEGIN{exit !($PCT >= 70)}"; then COLOR=green
          elif awk "BEGIN{exit !($PCT >= 50)}"; then COLOR=yellow
          else                                       COLOR=red
          fi
          echo "Coverage ${PCT}% (${COLOR})"
          echo "pct=${PCT}" >> "$GITHUB_OUTPUT"
          echo "color=${COLOR}" >> "$GITHUB_OUTPUT"

      - name: Update coverage gist
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: 2d4be46e60ee478d5703d8b009dbd6e9
          filename: kloak-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.pct }}%
          color: ${{ steps.coverage.outputs.color }}

  docker:
    name: Docker Build & Push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint, build, test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU (for arm64 final stage)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:dev
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push demo-go image
        uses: docker/build-push-action@v7
        with:
          context: ./examples/demo-go
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-demo-go:latest
            ghcr.io/${{ github.repository }}-demo-go:sha-${{ github.sha }}

  e2e:
    # The default leg (tc "auto", "dns-snoop") keeps the original check name
    # so required status checks still match. "clsact" reruns the suite with
    # the pre-6.6-kernel tc fallback forced on, since CI kernels support TCX
    # and would never exercise it. "virtual-ip" reruns it with the
    # experimental virtual IP host resolution (spinningfactory/kloak#327).
    name: ${{ (matrix.tc-attach-mode == 'auto' && matrix.host-resolution == 'dns-snoop') && 'E2E Tests' || (matrix.host-resolution != 'dns-snoop' && format('E2E Tests ({0})', matrix.host-resolution)) || format('E2E Tests (tc {0})', matrix.tc-attach-mode) }}
    runs-on: ubuntu-latest
    needs: [build, test]
    strategy:
      fail-fast: false
      matrix:
        tc-attach-mode: [auto, clsact]
        host-resolution: [dns-snoop]
        include:
          - tc-attach-mode: auto
            host-resolution: virtual-ip
    permissions:
      contents: read
      packages: write
    env:
      CACHE_REPO: ghcr.io/${{ github.repository }}/cache
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install clang and bpftool for eBPF
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev
          KVER="$(uname -r)" && sudo apt-get install -y linux-tools-common "linux-tools-${KVER}" 2>/dev/null || true

      # Diagnostic only: on runners with these CPU features OpenSSL >= 3.1
      # takes its AVX-512 GCM path (raw H never written; see ossl_read_gcm_h),
      # so record them to correlate any OpenSSL rewrite failure with the CPU.
      - name: Log CPU features
        run: |
          grep -m1 'model name' /proc/cpuinfo || true
          echo "AVX-512 GCM features: $(grep -owE 'avx512f|avx512dq|avx512bw|avx512vl|vaes|vpclmulqdq' /proc/cpuinfo | sort -u | tr '\n' ' ')"

      - name: Generate eBPF bindings
        run: KLOAK_TARGET_ARCH=x86 go generate ./pkg/ebpf/

      - name: Login to GHCR (for build cache)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install k3s
        run: |
          curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--write-kubeconfig-mode 644 --disable=traefik" sh -
          # Wait for node to register before running kubectl wait
          for i in $(seq 1 30); do
            sudo k3s kubectl get nodes -o name 2>/dev/null | grep -q . && break
            echo "Waiting for k3s node to register ($i/30)..."
            sleep 2
          done
          sudo k3s kubectl wait --for=condition=Ready node --all --timeout=120s
          mkdir -p ~/.kube
          sudo cp /etc/rancher/k3s/k3s.yaml ~/.kube/k3s-e2e.yaml
          sudo chown "$(id -u):$(id -g)" ~/.kube/k3s-e2e.yaml
          chmod 600 ~/.kube/k3s-e2e.yaml

      - name: Build and import images into k3s
        run: |
          # Build with GHCR registry cache. Unchanged layers are pulled from cache
          # instead of rebuilt. Cache is pushed on every build so it stays warm.
          #
          # ignore-error=true on every --cache-to is required so PRs from forks
          # don't fail the whole build at the cache push step. GitHub strips
          # `packages: write` from the GITHUB_TOKEN of fork PRs as a security
          # measure, which makes the registry push return 403 Forbidden. The
          # build itself succeeds regardless; ignore-error lets buildx log the
          # 403 and continue. Same-repo PRs and pushes still warm the cache
          # normally because their tokens carry the write scope.
          CACHE=${{ env.CACHE_REPO }}

          # BPF_DEBUG=1 compiles the bpf_printk markers in pkg/ebpf/bpf/tls_uprobe.c.
          # Their output streams to /sys/kernel/tracing/trace_pipe and is captured
          # by the "Start BPF trace capture" step below.
          docker buildx build --load \
            --cache-from type=registry,ref=${CACHE}:kloak \
            --cache-to type=registry,ref=${CACHE}:kloak,mode=max,ignore-error=true \
            --build-arg TARGETARCH=amd64 --build-arg COVER=1 --build-arg BPF_DEBUG=1 \
            -t kloak:e2e .

          docker buildx build --load \
            --cache-from type=registry,ref=${CACHE}:demo-go \
            --cache-to type=registry,ref=${CACHE}:demo-go,mode=max,ignore-error=true \
            -t kloak-demo-go:latest ./examples/demo-go/

          docker buildx build --load \
            --cache-from type=registry,ref=${CACHE}:demo-python \
            --cache-to type=registry,ref=${CACHE}:demo-python,mode=max,ignore-error=true \
            -t kloak-demo-python:latest ./examples/demo-python/

          docker buildx build --load \
            --cache-from type=registry,ref=${CACHE}:demo-js \
            --cache-to type=registry,ref=${CACHE}:demo-js,mode=max,ignore-error=true \
            -t kloak-demo-js:latest ./examples/demo-js/

          docker buildx build --load \
            --cache-from type=registry,ref=${CACHE}:demo-go-boring \
            --cache-to type=registry,ref=${CACHE}:demo-go-boring,mode=max,ignore-error=true \
            -t kloak-demo-go-boring:latest ./examples/demo-go-boring/

          docker buildx build --load \
            --cache-from type=registry,ref=${CACHE}:demo-gnutls \
            --cache-to type=registry,ref=${CACHE}:demo-gnutls,mode=max,ignore-error=true \
            -t kloak-demo-gnutls:latest ./examples/demo-gnutls/

          docker buildx build --load \
            --cache-from type=registry,ref=${CACHE}:demo-python-raw-tls \
            --cache-to type=registry,ref=${CACHE}:demo-python-raw-tls,mode=max,ignore-error=true \
            -t kloak-demo-python-raw-tls:latest ./examples/demo-python-raw-tls/

          # demo-boringssl builds BoringSSL from source (slow); the registry
          # cache keeps subsequent runs cheap.
          docker buildx build --load \
            --cache-from type=registry,ref=${CACHE}:demo-boringssl \
            --cache-to type=registry,ref=${CACHE}:demo-boringssl,mode=max,ignore-error=true \
            -t kloak-demo-boringssl:latest ./examples/demo-boringssl/

          docker buildx build --load \
            --cache-from type=registry,ref=${CACHE}:tls-echo \
            --cache-to type=registry,ref=${CACHE}:tls-echo,mode=max,ignore-error=true \
            -t kloak-tls-echo:latest ./test/e2e/tls-echo-server/

          # HTTPS header-echo server (httpbin.org replacement) for the Go +
          # HTTP/2 HPACK e2e paths. See test/e2e/http-echo-server.
          docker buildx build --load \
            --cache-from type=registry,ref=${CACHE}:http-echo \
            --cache-to type=registry,ref=${CACHE}:http-echo,mode=max,ignore-error=true \
            -t kloak-http-echo:latest ./test/e2e/http-echo-server/

          # demo-bun downloads the Bun profile build at image-build time; the
          # registry cache avoids re-downloading on every CI run.
          docker buildx build --load \
            --cache-from type=registry,ref=${CACHE}:demo-bun \
            --cache-to type=registry,ref=${CACHE}:demo-bun,mode=max,ignore-error=true \
            -t kloak-demo-bun:latest ./examples/demo-bun/

          docker save kloak:e2e kloak-demo-go:latest kloak-demo-python:latest \
            kloak-demo-js:latest kloak-demo-go-boring:latest \
            kloak-demo-gnutls:latest kloak-demo-python-raw-tls:latest \
            kloak-demo-boringssl:latest kloak-demo-bun:latest \
            kloak-tls-echo:latest kloak-http-echo:latest \
            | sudo k3s ctr -n k8s.io images import -

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Start BPF trace capture
        # bpf_printk in pkg/ebpf/bpf/tls_uprobe.c (compiled with BPF_DEBUG=1
        # above) streams to /sys/kernel/tracing/trace_pipe — a kernel ring
        # buffer that drains as it's read. We start a backgrounded reader
        # before the test so the full data-plane trace is available on
        # failure (the buffer otherwise rolls over within seconds).
        run: |
          sudo touch /tmp/bpf-trace.log
          sudo chmod 666 /tmp/bpf-trace.log
          sudo nohup sh -c 'cat /sys/kernel/tracing/trace_pipe > /tmp/bpf-trace.log 2>&1' >/dev/null 2>&1 &
          echo $! | sudo tee /tmp/bpf-trace.pid >/dev/null
          # Give the reader a moment to attach to the pipe.
          sleep 1
          ls -la /tmp/bpf-trace.log

      - name: Run E2E tests (with eBPF)
        run: go test -v -timeout 1500s -tags=e2e_ebpf -count=1 ./test/e2e/
        env:
          KUBECONFIG: /home/runner/.kube/k3s-e2e.yaml
          E2E_HELM_SET: controller.ebpf.tcAttachMode=${{ matrix.tc-attach-mode }},controller.ebpf.hostResolution=${{ matrix.host-resolution }}

      - name: Stop BPF trace capture
        if: always()
        run: |
          PID=$(cat /tmp/bpf-trace.pid 2>/dev/null) || true
          if [ -n "$PID" ]; then
            sudo kill "$PID" 2>/dev/null || true
          fi
          # The reader is a child of nohup'd sh; its `cat` may outlive the
          # shell. Sweep up by name as a safety net.
          sudo pkill -f "cat /sys/kernel/tracing/trace_pipe" 2>/dev/null || true
          # Make readable for the failure-collection step.
          sudo chmod 666 /tmp/bpf-trace.log 2>/dev/null || true
          echo "BPF trace size:"
          ls -la /tmp/bpf-trace.log 2>/dev/null || true

      - name: Collect e2e coverage
        if: always() && matrix.tc-attach-mode == 'auto' && matrix.host-resolution == 'dns-snoop'
        env:
          KUBECONFIG: /home/runner/.kube/k3s-e2e.yaml
        run: |
          mkdir -p /tmp/e2e-covdata
          # Run helm uninstall here unconditionally — the e2e teardown does
          # it too, but if the test process panicked (e.g. the suite's
          # 15-minute timer fired during a 4hop flake) teardown is skipped
          # and we'd be left with a running pod and no covcounters.
          helm uninstall kloak -n kloak-system --ignore-not-found 2>&1 || true
          # Wait for the controller and webhook pods to fully terminate. The
          # kloak binary's `flushCoverage` (cmd/kloak/coverage_flush_cover.go,
          # compiled in via -tags cover when COVER=1) writes covcounters
          # before main returns, so any clean exit produces a usable
          # profile. 90s covers the controller's 60s
          # terminationGracePeriodSeconds plus uprobe detach / BPF close time.
          kubectl wait --for=delete pod -l 'app.kubernetes.io/component in (controller,webhook)' \
            -n kloak-system --timeout=90s 2>/dev/null || true
          # k3s runs directly on the runner, so covdata lives at /tmp/kloak-coverage
          # on the host filesystem (values-e2e.yaml's coverage.hostPath).
          sudo cp -r /tmp/kloak-coverage/. /tmp/e2e-covdata/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" /tmp/e2e-covdata || true
          echo "E2E coverage files:"
          ls -la /tmp/e2e-covdata/ 2>/dev/null || echo "No coverage files collected"

      - name: Download unit coverage
        # `continue-on-error` so a re-run of just this job after the artifact
        # has been GC'd doesn't fail the whole workflow — we'll fall back to
        # e2e-only coverage in the merge step below.
        if: always() && matrix.tc-attach-mode == 'auto' && matrix.host-resolution == 'dns-snoop'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: unit-coverage
          path: /tmp/unit-coverage

      - name: Merge unit and e2e coverage
        if: always() && matrix.tc-attach-mode == 'auto' && matrix.host-resolution == 'dns-snoop'
        run: |
          # Convert e2e covdata (binary) to Go text format.
          if ls /tmp/e2e-covdata/covcounters.* 1>/dev/null 2>&1; then
            go tool covdata textfmt -i=/tmp/e2e-covdata -o=/tmp/e2e-coverage.out
            echo "E2E coverage converted to text format"
          else
            echo "No e2e coverage data found"
          fi

          # Build the combined profile. Each profile starts with a `mode:` line
          # plus per-line records. We pick whichever inputs exist.
          # Drop the generated eBPF bindings (tlsuprobe_bpfel.go /
          # tlsuprobe_bpfeb.go) from BOTH halves — they're only on disk on
          # nodes that ran `go generate`, and downstream jobs that read the
          # profile (Coverage Badge runs `go tool cover -func` against the
          # whole file) will fail otherwise. Apply the filter to the unit
          # half too, since pkg/ebpf is now in unit coverage.
          UNIT=/tmp/unit-coverage/coverage.out
          E2E=/tmp/e2e-coverage.out
          OUT=/tmp/combined-coverage.out

          # head -1 keeps the `mode:` line; the filter trims subsequent lines.
          strip_generated() { grep -v 'tlsuprobe_bpf'; }

          if [ -f "$UNIT" ] && [ -f "$E2E" ]; then
            # `go tool cover` only merges records whose block ranges match
            # exactly. Go releases differ in how they split the same source
            # into blocks, so profiles from two toolchains don't line up and
            # every statement gets counted once per profile, dragging the
            # total far down. Files present in both profiles must therefore
            # list exactly the same blocks.
            MISMATCHED=$(awk '
              FNR == 1 { next }
              NR == FNR { split($1, a, ":"); files[a[1]] = 1; blocks[$1] = 1; next }
              { split($1, a, ":"); if ((a[1] in files) && !($1 in blocks)) n++ }
              END { print n + 0 }
            ' <(strip_generated < "$UNIT") <(strip_generated < "$E2E"))
            if [ "$MISMATCHED" -gt 0 ]; then
              echo "::error::$MISMATCHED e2e coverage blocks don't match the unit profile's block boundaries. The kloak image and the unit tests were most likely built with different Go releases (Dockerfile golang image vs GO_VERSION); merging would double-count statements."
              exit 1
            fi
            head -1 "$UNIT" > "$OUT"
            tail -n +2 "$UNIT" | strip_generated >> "$OUT"
            tail -n +2 "$E2E"  | strip_generated >> "$OUT"
            echo "Combined unit + e2e coverage"
          elif [ -f "$UNIT" ]; then
            head -1 "$UNIT" > "$OUT"
            tail -n +2 "$UNIT" | strip_generated >> "$OUT"
            echo "Unit coverage only (no e2e data)"
          elif [ -f "$E2E" ]; then
            head -1 "$E2E" > "$OUT"
            tail -n +2 "$E2E" | strip_generated >> "$OUT"
            echo "E2E coverage only (no unit artifact — likely a single-job re-run after retention)"
          else
            echo "No coverage data available; producing empty profile"
            echo "mode: atomic" > "$OUT"
          fi

          echo "=== Combined coverage summary ==="
          go tool cover -func="$OUT" | tail -1

      - name: Upload combined coverage
        if: always() && matrix.tc-attach-mode == 'auto' && matrix.host-resolution == 'dns-snoop'
        uses: actions/upload-artifact@v7
        with:
          name: combined-coverage
          path: /tmp/combined-coverage.out
          retention-days: 7
          if-no-files-found: ignore

      - name: Collect logs and BPF debug info on failure
        if: failure()
        env:
          KUBECONFIG: /home/runner/.kube/k3s-e2e.yaml
        run: |
          # At trace level the controller emits the per-5s debug counter dump
          # plus per-secret sync details, which fills 200 lines in a few
          # seconds. 5000 keeps roughly 10+ minutes of context — enough to
          # span the test that actually flaked plus its setup.
          echo "=== Kloak Controller Logs ==="
          kubectl logs -n kloak-system -l app.kubernetes.io/component=controller --tail=5000 2>/dev/null || true
          echo "=== Kloak Webhook Logs ==="
          kubectl logs -n kloak-system -l app.kubernetes.io/component=webhook --tail=500 2>/dev/null || true
          echo "=== Demo App Logs ==="
          for app in demo-go demo-python demo-js demo-go-boring demo-python-raw-tls; do
            echo "--- $app ---"
            kubectl logs -n kloak-e2e -l app=$app --tail=200 2>/dev/null || true
          done
          echo "=== All Pods ==="
          kubectl get pods -A 2>/dev/null || true
          echo "=== Events ==="
          kubectl get events -n kloak-e2e --sort-by='.lastTimestamp' 2>/dev/null || true
          echo "=== Describe Controller ==="
          kubectl describe daemonset -n kloak-system kloak-controller 2>/dev/null || true
          echo "=== BPF Programs ==="
          sudo bpftool prog list 2>/dev/null || true
          echo "=== BPF Maps ==="
          sudo bpftool map list 2>/dev/null || true
          # A controller that never finishes shutting down leaves its pod
          # Terminating past the grace period: show where each of its
          # threads is blocked in the kernel.
          echo "=== Kloak controller threads (state, kernel stack) ==="
          for p in $(pgrep -f '/kloak controller' || true); do
            echo "--- pid $p: $(sudo grep -E '^(State|Threads):' /proc/$p/status 2>/dev/null | tr '\n' ' ')"
            for t in /proc/$p/task/*; do
              echo "tid ${t##*/} state=$(sudo cut -d' ' -f3 $t/stat 2>/dev/null) wchan=$(sudo cat $t/wchan 2>/dev/null)"
              sudo cat $t/stack 2>/dev/null || true
            done
          done
          echo "=== Tasks in uninterruptible sleep ==="
          ps -eo pid,tid,stat,wchan:32,comm -L | awk 'NR == 1 || $3 ~ /^D/' || true
          echo "=== Kernel dmesg (last 50 lines) ==="
          sudo dmesg | tail -50 2>/dev/null || true
          # Captured trace_pipe output for the whole run. Filter to kloak's
          # bpf_printk lines and tail so the workflow log stays readable;
          # the full file is uploaded as an artifact below.
          echo "=== BPF trace (kloak-only, last 500 lines) ==="
          if [ -s /tmp/bpf-trace.log ]; then
            grep -F kloak /tmp/bpf-trace.log | tail -500 || true
          else
            echo "(no trace captured)"
          fi

      - name: Upload BPF trace
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bpf-trace-${{ matrix.tc-attach-mode }}-${{ matrix.host-resolution }}
          path: /tmp/bpf-trace.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop k3s
        if: always()
        run: |
          sudo /usr/local/bin/k3s-killall.sh 2>/dev/null || true
          sudo /usr/local/bin/k3s-uninstall.sh 2>/dev/null || true
          rm -f ~/.kube/k3s-e2e.yaml
