name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: '1.25'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install clang for eBPF generation
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev

      - name: Generate eBPF bindings
        run: KLOAK_TARGET_ARCH=x86 go generate ./pkg/ebpf/

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.4
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install clang for eBPF generation
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev

      - name: Generate eBPF bindings
        run: KLOAK_TARGET_ARCH=x86 go generate ./pkg/ebpf/

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        run: go build -v -o bin/kloak ./cmd/kloak

      - name: Upload binary
        uses: actions/upload-artifact@v5
        with:
          name: kloak-binary
          path: bin/kloak
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install clang for eBPF generation
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev

      - name: Generate eBPF bindings
        run: KLOAK_TARGET_ARCH=x86 go generate ./pkg/ebpf/

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out $(go list ./... | grep -v /test/e2e)

      - name: Upload coverage
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  docker:
    name: Docker Build & Push (Multi-Arch)
    runs-on: ubuntu-latest
    needs: [lint, build, test]
    permissions:
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=e2e-${{ github.run_id }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Create k3d cluster (with BPF mounts)
        run: |
          k3d cluster create kloak-e2e --wait --timeout 120s \
            --volume /sys/kernel/btf:/sys/kernel/btf:ro@server:0 \
            --volume /sys/fs/bpf:/sys/fs/bpf:rw@server:0
          k3d kubeconfig get kloak-e2e > /tmp/kubeconfig-e2e.yaml

      - name: Pull and import images into k3d
        run: |
          docker pull ghcr.io/${{ github.repository }}:e2e-${{ github.run_id }}
          docker tag ghcr.io/${{ github.repository }}:e2e-${{ github.run_id }} kloak:e2e
          k3d image import kloak:e2e -c kloak-e2e
          docker build -t kloak-demo-go:e2e -t kloak-demo-go:latest ./examples/demo-go/
          k3d image import kloak-demo-go:e2e kloak-demo-go:latest -c kloak-e2e
          docker pull bitnami/kubectl:latest
          k3d image import bitnami/kubectl:latest -c kloak-e2e

      - name: Run E2E tests (with eBPF)
        run: go test -v -timeout 600s -tags=e2e_ebpf -count=1 ./test/e2e/
        env:
          KUBECONFIG: /tmp/kubeconfig-e2e.yaml
          KLOAK_E2E_OVERLAY: e2e-ebpf

      - name: Collect logs on failure
        if: failure()
        env:
          KUBECONFIG: /tmp/kubeconfig-e2e.yaml
        run: |
          echo "=== Kloak Controller Logs ==="
          kubectl logs -n kloak-system -l app.kubernetes.io/component=controller --tail=200 2>/dev/null || true
          echo "=== Kloak Webhook Logs ==="
          kubectl logs -n kloak-system -l app.kubernetes.io/component=webhook --tail=100 2>/dev/null || true
          echo "=== Demo App Logs ==="
          kubectl logs -n kloak-e2e -l app=demo-go --tail=100 2>/dev/null || true
          echo "=== All Pods ==="
          kubectl get pods -A 2>/dev/null || true
          echo "=== Events ==="
          kubectl get events -n kloak-e2e --sort-by='.lastTimestamp' 2>/dev/null || true
          echo "=== Describe Controller ==="
          kubectl describe daemonset -n kloak-system kloak-controller 2>/dev/null || true

      - name: Delete k3d cluster
        if: always()
        run: k3d cluster delete kloak-e2e
