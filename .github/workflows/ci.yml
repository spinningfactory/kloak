name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true


jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install clang for eBPF generation
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev

      - name: Generate eBPF bindings
        run: KLOAK_TARGET_ARCH=x86 go generate ./pkg/ebpf/

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --timeout=5m

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Lint Helm chart
        run: helm lint charts/kloak

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install clang for eBPF generation
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev

      - name: Generate eBPF bindings
        run: KLOAK_TARGET_ARCH=x86 go generate ./pkg/ebpf/

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        run: go build -v -o bin/kloak ./cmd/kloak

      # Binary artifact skipped to save storage quota.

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install clang for eBPF generation
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev

      - name: Generate eBPF bindings
        run: KLOAK_TARGET_ARCH=x86 go generate ./pkg/ebpf/

      - name: Download dependencies
        run: go mod download

      - name: Run eBPF helper C tests
        run: make test-bpf-helpers

      - name: Run tests
        # Include pkg/ebpf (Linux-tagged BPF tests self-skip via t.Skipf when
        # eBPF resources aren't available on the runner) and pkg/cgroups (its
        # utils.go is pure parsing + the cgroup_linux/cgroup_other split takes
        # care of platform deps). Exclude:
        #   - test/e2e — separate job
        #   - cmd/      — entrypoint wiring; coverage merges via the e2e binary
        #   - tools/    — CLI utilities, coverage isn't meaningful
        run: go test -v -race -coverprofile=coverage.out $(go list ./... | grep -v -E '/test/e2e|/cmd/|/tools/')

      - name: Upload unit coverage
        uses: actions/upload-artifact@v5
        with:
          name: unit-coverage
          path: coverage.out
          # 7 days so a single-job re-run of e2e (or coverage) within a week
          # still finds the artifact. 1 day was too tight — the e2e job often
          # gets re-run after a data-plane flake, hours or days later.
          retention-days: 7

  # Coverage Report runs on pull requests and comments a diff summary.
  # Depends on e2e so it can work against the merged unit + e2e profile.
  coverage:
    name: Coverage Report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [e2e]
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: fgrosse/go-coverage-report@v1.3.0
        with:
          coverage-artifact-name: combined-coverage
          coverage-file-name: combined-coverage.out

  # Coverage Badge runs on push-to-main and commits the updated badge to README.
  coverage-badge:
    name: Coverage Badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [e2e]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download combined coverage
        uses: actions/download-artifact@v5
        with:
          name: combined-coverage
          path: /tmp/combined-coverage

      - name: Prepare coverage for badge
        run: |
          go tool cover -func=/tmp/combined-coverage/combined-coverage.out -o=coverage.out

      - name: Update coverage badge
        uses: tj-actions/coverage-badge-go@v3
        with:
          filename: coverage.out

      - name: Verify changed files
        uses: tj-actions/verify-changed-files@v16
        id: verify-changed-files
        with:
          files: README.md

      - name: Commit coverage badge
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git commit -m "chore: update coverage badge"
          git push

  docker:
    name: Docker Build & Push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint, build, test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU (for arm64 final stage)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:dev
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push demo-go image
        uses: docker/build-push-action@v7
        with:
          context: ./examples/demo-go
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-demo-go:latest
            ghcr.io/${{ github.repository }}-demo-go:sha-${{ github.sha }}

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build, test]
    permissions:
      contents: read
      packages: write
    env:
      CACHE_REPO: ghcr.io/${{ github.repository }}/cache
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install clang and bpftool for eBPF
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev
          KVER="$(uname -r)" && sudo apt-get install -y linux-tools-common "linux-tools-${KVER}" 2>/dev/null || true

      - name: Generate eBPF bindings
        run: KLOAK_TARGET_ARCH=x86 go generate ./pkg/ebpf/

      - name: Login to GHCR (for build cache)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install k3s
        run: |
          curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--write-kubeconfig-mode 644 --disable=traefik" sh -
          # Wait for node to register before running kubectl wait
          for i in $(seq 1 30); do
            sudo k3s kubectl get nodes -o name 2>/dev/null | grep -q . && break
            echo "Waiting for k3s node to register ($i/30)..."
            sleep 2
          done
          sudo k3s kubectl wait --for=condition=Ready node --all --timeout=120s
          mkdir -p ~/.kube
          sudo cp /etc/rancher/k3s/k3s.yaml ~/.kube/k3s-e2e.yaml
          sudo chown "$(id -u):$(id -g)" ~/.kube/k3s-e2e.yaml
          chmod 600 ~/.kube/k3s-e2e.yaml

      - name: Build and import images into k3s
        run: |
          # Build with GHCR registry cache. Unchanged layers are pulled from cache
          # instead of rebuilt. Cache is pushed on every build so it stays warm.
          CACHE=${{ env.CACHE_REPO }}

          # BPF_DEBUG=1 compiles the bpf_printk markers in pkg/ebpf/bpf/tls_uprobe.c.
          # Their output streams to /sys/kernel/tracing/trace_pipe and is captured
          # by the "Start BPF trace capture" step below.
          docker buildx build --load \
            --cache-from type=registry,ref=${CACHE}:kloak \
            --cache-to type=registry,ref=${CACHE}:kloak,mode=max \
            --build-arg TARGETARCH=amd64 --build-arg COVER=1 --build-arg BPF_DEBUG=1 \
            -t kloak:e2e .

          docker buildx build --load \
            --cache-from type=registry,ref=${CACHE}:demo-go \
            --cache-to type=registry,ref=${CACHE}:demo-go,mode=max \
            -t kloak-demo-go:latest ./examples/demo-go/

          docker buildx build --load \
            --cache-from type=registry,ref=${CACHE}:demo-python \
            --cache-to type=registry,ref=${CACHE}:demo-python,mode=max \
            -t kloak-demo-python:latest ./examples/demo-python/

          docker buildx build --load \
            --cache-from type=registry,ref=${CACHE}:demo-js \
            --cache-to type=registry,ref=${CACHE}:demo-js,mode=max \
            -t kloak-demo-js:latest ./examples/demo-js/

          docker buildx build --load \
            --cache-from type=registry,ref=${CACHE}:demo-go-boring \
            --cache-to type=registry,ref=${CACHE}:demo-go-boring,mode=max \
            -t kloak-demo-go-boring:latest ./examples/demo-go-boring/

          docker buildx build --load \
            --cache-from type=registry,ref=${CACHE}:demo-gnutls \
            --cache-to type=registry,ref=${CACHE}:demo-gnutls,mode=max \
            -t kloak-demo-gnutls:latest ./examples/demo-gnutls/

          docker buildx build --load \
            --cache-from type=registry,ref=${CACHE}:demo-python-raw-tls \
            --cache-to type=registry,ref=${CACHE}:demo-python-raw-tls,mode=max \
            -t kloak-demo-python-raw-tls:latest ./examples/demo-python-raw-tls/

          docker buildx build --load \
            --cache-from type=registry,ref=${CACHE}:tls-echo \
            --cache-to type=registry,ref=${CACHE}:tls-echo,mode=max \
            -t kloak-tls-echo:latest ./test/e2e/tls-echo-server/

          docker save kloak:e2e kloak-demo-go:latest kloak-demo-python:latest \
            kloak-demo-js:latest kloak-demo-go-boring:latest \
            kloak-demo-gnutls:latest kloak-demo-python-raw-tls:latest \
            kloak-tls-echo:latest | sudo k3s ctr -n k8s.io images import -

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Start BPF trace capture
        # bpf_printk in pkg/ebpf/bpf/tls_uprobe.c (compiled with BPF_DEBUG=1
        # above) streams to /sys/kernel/tracing/trace_pipe — a kernel ring
        # buffer that drains as it's read. We start a backgrounded reader
        # before the test so the full data-plane trace is available on
        # failure (the buffer otherwise rolls over within seconds).
        run: |
          sudo touch /tmp/bpf-trace.log
          sudo chmod 666 /tmp/bpf-trace.log
          sudo nohup sh -c 'cat /sys/kernel/tracing/trace_pipe > /tmp/bpf-trace.log 2>&1' >/dev/null 2>&1 &
          echo $! | sudo tee /tmp/bpf-trace.pid >/dev/null
          # Give the reader a moment to attach to the pipe.
          sleep 1
          ls -la /tmp/bpf-trace.log

      - name: Run E2E tests (with eBPF)
        run: go test -v -timeout 900s -tags=e2e_ebpf -count=1 ./test/e2e/
        env:
          KUBECONFIG: /home/runner/.kube/k3s-e2e.yaml

      - name: Stop BPF trace capture
        if: always()
        run: |
          PID=$(cat /tmp/bpf-trace.pid 2>/dev/null) || true
          if [ -n "$PID" ]; then
            sudo kill "$PID" 2>/dev/null || true
          fi
          # The reader is a child of nohup'd sh; its `cat` may outlive the
          # shell. Sweep up by name as a safety net.
          sudo pkill -f "cat /sys/kernel/tracing/trace_pipe" 2>/dev/null || true
          # Make readable for the failure-collection step.
          sudo chmod 666 /tmp/bpf-trace.log 2>/dev/null || true
          echo "BPF trace size:"
          ls -la /tmp/bpf-trace.log 2>/dev/null || true

      - name: Collect e2e coverage
        if: always()
        env:
          KUBECONFIG: /home/runner/.kube/k3s-e2e.yaml
        run: |
          mkdir -p /tmp/e2e-covdata
          # Stream controller logs in the background so we capture the FULL
          # shutdown sequence — "shutdown signal received, draining" →
          # uprobe close → "controller exited cleanly" → process exit. The
          # earlier `kubectl logs --tail` racing the shutdown was returning
          # before kloak had finished its cleanup (we'd see "draining" but
          # never "exited cleanly", because the pod was still mid-Close at
          # log-fetch time). `kubectl logs -f` follows until the pod is
          # gone, then exits naturally — no timeout-killing needed.
          (kubectl logs -f -n kloak-system \
            -l app.kubernetes.io/component=controller \
            --tail=-1 2>/dev/null > /tmp/kloak-controller.log) &
          LOG_PID=$!
          # Wait for the controller pod to fully terminate so the Go coverage
          # runtime can flush covcounters to the hostPath volume on clean exit.
          # 90s covers the 60s pod terminationGracePeriodSeconds plus uprobe
          # detach / BPF close time. helm uninstall (from teardown) doesn't
          # actually wait for pods despite --wait, so this is the real wait.
          kubectl wait --for=delete pod -l app.kubernetes.io/component=controller \
            -n kloak-system --timeout=90s 2>/dev/null || true
          # Pod is gone (or wait timed out). Give the background stream a
          # moment to flush its tail to the file, then snapshot it.
          sleep 2
          kill "$LOG_PID" 2>/dev/null || true
          wait "$LOG_PID" 2>/dev/null || true
          echo "=== Kloak Controller Logs (full shutdown sequence) ==="
          tail -n 200 /tmp/kloak-controller.log 2>/dev/null || echo "no log file"
          # k3s runs directly on the runner, so covdata lives at /tmp/kloak-coverage
          # on the host filesystem (values-e2e.yaml's coverage.hostPath).
          sudo cp -r /tmp/kloak-coverage/. /tmp/e2e-covdata/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" /tmp/e2e-covdata || true
          echo "E2E coverage files:"
          ls -la /tmp/e2e-covdata/ 2>/dev/null || echo "No coverage files collected"

      - name: Download unit coverage
        # `continue-on-error` so a re-run of just this job after the artifact
        # has been GC'd doesn't fail the whole workflow — we'll fall back to
        # e2e-only coverage in the merge step below.
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: unit-coverage
          path: /tmp/unit-coverage

      - name: Merge unit and e2e coverage
        if: always()
        run: |
          # Convert e2e covdata (binary) to Go text format.
          if ls /tmp/e2e-covdata/covcounters.* 1>/dev/null 2>&1; then
            go tool covdata textfmt -i=/tmp/e2e-covdata -o=/tmp/e2e-coverage.out
            echo "E2E coverage converted to text format"
          else
            echo "No e2e coverage data found"
          fi

          # Build the combined profile. Each profile starts with a `mode:` line
          # plus per-line records. We pick whichever inputs exist.
          # Drop the generated eBPF bindings (tlsuprobe_bpfel.go /
          # tlsuprobe_bpfeb.go) from BOTH halves — they're only on disk on
          # nodes that ran `go generate`, and downstream jobs that read the
          # profile (Coverage Badge runs `go tool cover -func` against the
          # whole file) will fail otherwise. Apply the filter to the unit
          # half too, since pkg/ebpf is now in unit coverage.
          UNIT=/tmp/unit-coverage/coverage.out
          E2E=/tmp/e2e-coverage.out
          OUT=/tmp/combined-coverage.out

          # head -1 keeps the `mode:` line; the filter trims subsequent lines.
          strip_generated() { grep -v 'tlsuprobe_bpf'; }

          if [ -f "$UNIT" ] && [ -f "$E2E" ]; then
            head -1 "$UNIT" > "$OUT"
            tail -n +2 "$UNIT" | strip_generated >> "$OUT"
            tail -n +2 "$E2E"  | strip_generated >> "$OUT"
            echo "Combined unit + e2e coverage"
          elif [ -f "$UNIT" ]; then
            head -1 "$UNIT" > "$OUT"
            tail -n +2 "$UNIT" | strip_generated >> "$OUT"
            echo "Unit coverage only (no e2e data)"
          elif [ -f "$E2E" ]; then
            head -1 "$E2E" > "$OUT"
            tail -n +2 "$E2E" | strip_generated >> "$OUT"
            echo "E2E coverage only (no unit artifact — likely a single-job re-run after retention)"
          else
            echo "No coverage data available; producing empty profile"
            echo "mode: atomic" > "$OUT"
          fi

          echo "=== Combined coverage summary ==="
          go tool cover -func="$OUT" | tail -1

      - name: Upload combined coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: combined-coverage
          path: /tmp/combined-coverage.out
          retention-days: 7
          if-no-files-found: ignore

      - name: Collect logs and BPF debug info on failure
        if: failure()
        env:
          KUBECONFIG: /home/runner/.kube/k3s-e2e.yaml
        run: |
          # At trace level the controller emits the per-5s debug counter dump
          # plus per-secret sync details, which fills 200 lines in a few
          # seconds. 5000 keeps roughly 10+ minutes of context — enough to
          # span the test that actually flaked plus its setup.
          echo "=== Kloak Controller Logs ==="
          kubectl logs -n kloak-system -l app.kubernetes.io/component=controller --tail=5000 2>/dev/null || true
          echo "=== Kloak Webhook Logs ==="
          kubectl logs -n kloak-system -l app.kubernetes.io/component=webhook --tail=500 2>/dev/null || true
          echo "=== Demo App Logs ==="
          for app in demo-go demo-python demo-js demo-go-boring demo-python-raw-tls; do
            echo "--- $app ---"
            kubectl logs -n kloak-e2e -l app=$app --tail=200 2>/dev/null || true
          done
          echo "=== All Pods ==="
          kubectl get pods -A 2>/dev/null || true
          echo "=== Events ==="
          kubectl get events -n kloak-e2e --sort-by='.lastTimestamp' 2>/dev/null || true
          echo "=== Describe Controller ==="
          kubectl describe daemonset -n kloak-system kloak-controller 2>/dev/null || true
          echo "=== BPF Programs ==="
          sudo bpftool prog list 2>/dev/null || true
          echo "=== BPF Maps ==="
          sudo bpftool map list 2>/dev/null || true
          echo "=== Kernel dmesg (last 50 lines) ==="
          sudo dmesg | tail -50 2>/dev/null || true
          # Captured trace_pipe output for the whole run. Filter to kloak's
          # bpf_printk lines and tail so the workflow log stays readable;
          # the full file is uploaded as an artifact below.
          echo "=== BPF trace (kloak-only, last 500 lines) ==="
          if [ -s /tmp/bpf-trace.log ]; then
            grep -F kloak /tmp/bpf-trace.log | tail -500 || true
          else
            echo "(no trace captured)"
          fi

      - name: Upload BPF trace
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bpf-trace
          path: /tmp/bpf-trace.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop k3s
        if: always()
        run: |
          sudo /usr/local/bin/k3s-killall.sh 2>/dev/null || true
          sudo /usr/local/bin/k3s-uninstall.sh 2>/dev/null || true
          rm -f ~/.kube/k3s-e2e.yaml
