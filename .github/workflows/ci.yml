name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true


jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install clang for eBPF generation
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev

      - name: Generate eBPF bindings
        run: KLOAK_TARGET_ARCH=x86 go generate ./pkg/ebpf/

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --timeout=5m

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Lint Helm chart
        run: helm lint charts/kloak

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install clang for eBPF generation
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev

      - name: Generate eBPF bindings
        run: KLOAK_TARGET_ARCH=x86 go generate ./pkg/ebpf/

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        run: go build -v -o bin/kloak ./cmd/kloak

      # Binary artifact skipped to save storage quota.

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install clang for eBPF generation
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev

      - name: Generate eBPF bindings
        run: KLOAK_TARGET_ARCH=x86 go generate ./pkg/ebpf/

      - name: Download dependencies
        run: go mod download

      - name: Run eBPF helper C tests
        run: make test-bpf-helpers

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out $(go list ./... | grep -v -E '/test/e2e|/cmd/|/pkg/ebpf|/pkg/cgroups')

      - name: Upload unit coverage
        uses: actions/upload-artifact@v5
        with:
          name: unit-coverage
          path: coverage.out
          # 7 days so a single-job re-run of e2e (or coverage) within a week
          # still finds the artifact. 1 day was too tight — the e2e job often
          # gets re-run after a data-plane flake, hours or days later.
          retention-days: 7

  # Coverage Report runs on pull requests and comments a diff summary.
  # Depends on e2e so it can work against the merged unit + e2e profile.
  coverage:
    name: Coverage Report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [e2e]
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: fgrosse/go-coverage-report@v1.3.0
        with:
          coverage-artifact-name: combined-coverage
          coverage-file-name: combined-coverage.out

  # Coverage Badge runs on push-to-main and commits the updated badge to README.
  coverage-badge:
    name: Coverage Badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [e2e]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download combined coverage
        uses: actions/download-artifact@v5
        with:
          name: combined-coverage
          path: /tmp/combined-coverage

      - name: Prepare coverage for badge
        run: |
          go tool cover -func=/tmp/combined-coverage/combined-coverage.out -o=coverage.out

      - name: Update coverage badge
        uses: tj-actions/coverage-badge-go@v3
        with:
          filename: coverage.out

      - name: Verify changed files
        uses: tj-actions/verify-changed-files@v16
        id: verify-changed-files
        with:
          files: README.md

      - name: Commit coverage badge
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git commit -m "chore: update coverage badge"
          git push

  docker:
    name: Docker Build & Push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint, build, test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU (for arm64 final stage)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:dev
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push demo-go image
        uses: docker/build-push-action@v7
        with:
          context: ./examples/demo-go
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-demo-go:latest
            ghcr.io/${{ github.repository }}-demo-go:sha-${{ github.sha }}

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build, test]
    permissions:
      contents: read
      packages: write
    env:
      CACHE_REPO: ghcr.io/${{ github.repository }}/cache
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install clang and bpftool for eBPF
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev
          KVER="$(uname -r)" && sudo apt-get install -y linux-tools-common "linux-tools-${KVER}" 2>/dev/null || true

      - name: Generate eBPF bindings
        run: KLOAK_TARGET_ARCH=x86 go generate ./pkg/ebpf/

      - name: Login to GHCR (for build cache)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install k3s
        run: |
          curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--write-kubeconfig-mode 644 --disable=traefik" sh -
          # Wait for node to register before running kubectl wait
          for i in $(seq 1 30); do
            sudo k3s kubectl get nodes -o name 2>/dev/null | grep -q . && break
            echo "Waiting for k3s node to register ($i/30)..."
            sleep 2
          done
          sudo k3s kubectl wait --for=condition=Ready node --all --timeout=120s
          mkdir -p ~/.kube
          sudo cp /etc/rancher/k3s/k3s.yaml ~/.kube/k3s-e2e.yaml
          sudo chown "$(id -u):$(id -g)" ~/.kube/k3s-e2e.yaml
          chmod 600 ~/.kube/k3s-e2e.yaml

      - name: Build and import images into k3s
        run: |
          # Build with GHCR registry cache. Unchanged layers are pulled from cache
          # instead of rebuilt. Cache is pushed on every build so it stays warm.
          CACHE=${{ env.CACHE_REPO }}

          docker buildx build --load \
            --cache-from type=registry,ref=${CACHE}:kloak \
            --cache-to type=registry,ref=${CACHE}:kloak,mode=max \
            --build-arg TARGETARCH=amd64 --build-arg COVER=1 -t kloak:e2e .

          docker buildx build --load \
            --cache-from type=registry,ref=${CACHE}:demo-go \
            --cache-to type=registry,ref=${CACHE}:demo-go,mode=max \
            -t kloak-demo-go:latest ./examples/demo-go/

          docker buildx build --load \
            --cache-from type=registry,ref=${CACHE}:demo-python \
            --cache-to type=registry,ref=${CACHE}:demo-python,mode=max \
            -t kloak-demo-python:latest ./examples/demo-python/

          docker buildx build --load \
            --cache-from type=registry,ref=${CACHE}:demo-js \
            --cache-to type=registry,ref=${CACHE}:demo-js,mode=max \
            -t kloak-demo-js:latest ./examples/demo-js/

          docker buildx build --load \
            --cache-from type=registry,ref=${CACHE}:demo-go-boring \
            --cache-to type=registry,ref=${CACHE}:demo-go-boring,mode=max \
            -t kloak-demo-go-boring:latest ./examples/demo-go-boring/

          docker buildx build --load \
            --cache-from type=registry,ref=${CACHE}:demo-gnutls \
            --cache-to type=registry,ref=${CACHE}:demo-gnutls,mode=max \
            -t kloak-demo-gnutls:latest ./examples/demo-gnutls/

          docker buildx build --load \
            --cache-from type=registry,ref=${CACHE}:demo-python-raw-tls \
            --cache-to type=registry,ref=${CACHE}:demo-python-raw-tls,mode=max \
            -t kloak-demo-python-raw-tls:latest ./examples/demo-python-raw-tls/

          docker buildx build --load \
            --cache-from type=registry,ref=${CACHE}:tls-echo \
            --cache-to type=registry,ref=${CACHE}:tls-echo,mode=max \
            -t kloak-tls-echo:latest ./test/e2e/tls-echo-server/

          docker save kloak:e2e kloak-demo-go:latest kloak-demo-python:latest \
            kloak-demo-js:latest kloak-demo-go-boring:latest \
            kloak-demo-gnutls:latest kloak-demo-python-raw-tls:latest \
            kloak-tls-echo:latest | sudo k3s ctr -n k8s.io images import -

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Run E2E tests (with eBPF)
        run: go test -v -timeout 900s -tags=e2e_ebpf -count=1 ./test/e2e/
        env:
          KUBECONFIG: /home/runner/.kube/k3s-e2e.yaml

      - name: Collect e2e coverage
        if: always()
        env:
          KUBECONFIG: /home/runner/.kube/k3s-e2e.yaml
        run: |
          mkdir -p /tmp/e2e-covdata
          # Wait for the controller pod to fully terminate so the Go coverage
          # runtime can flush covcounters to the hostPath volume on clean exit.
          # Helm uninstall from test teardown triggers the shutdown.
          kubectl wait --for=delete pod -l app.kubernetes.io/component=controller \
            -n kloak-system --timeout=30s 2>/dev/null || true
          # k3s runs directly on the runner, so covdata lives at /tmp/kloak-coverage
          # on the host filesystem (values-e2e.yaml's coverage.hostPath).
          sudo cp -r /tmp/kloak-coverage/. /tmp/e2e-covdata/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" /tmp/e2e-covdata || true
          echo "E2E coverage files:"
          ls -la /tmp/e2e-covdata/ 2>/dev/null || echo "No coverage files collected"

      - name: Download unit coverage
        # `continue-on-error` so a re-run of just this job after the artifact
        # has been GC'd doesn't fail the whole workflow — we'll fall back to
        # e2e-only coverage in the merge step below.
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: unit-coverage
          path: /tmp/unit-coverage

      - name: Merge unit and e2e coverage
        if: always()
        run: |
          # Convert e2e covdata (binary) to Go text format.
          if ls /tmp/e2e-covdata/covcounters.* 1>/dev/null 2>&1; then
            go tool covdata textfmt -i=/tmp/e2e-covdata -o=/tmp/e2e-coverage.out
            echo "E2E coverage converted to text format"
          else
            echo "No e2e coverage data found"
          fi

          # Build the combined profile. Each profile starts with a `mode:` line
          # plus per-line records. We pick whichever inputs exist.
          # Drop the generated eBPF bindings — they have no source on the runner,
          # so the coverage reporter can't resolve them.
          UNIT=/tmp/unit-coverage/coverage.out
          E2E=/tmp/e2e-coverage.out
          OUT=/tmp/combined-coverage.out

          if [ -f "$UNIT" ] && [ -f "$E2E" ]; then
            cp "$UNIT" "$OUT"
            tail -n +2 "$E2E" | grep -v 'tlsuprobe_bpf' >> "$OUT"
            echo "Combined unit + e2e coverage"
          elif [ -f "$UNIT" ]; then
            cp "$UNIT" "$OUT"
            echo "Unit coverage only (no e2e data)"
          elif [ -f "$E2E" ]; then
            grep -v 'tlsuprobe_bpf' "$E2E" > "$OUT"
            echo "E2E coverage only (no unit artifact — likely a single-job re-run after retention)"
          else
            echo "No coverage data available; producing empty profile"
            echo "mode: atomic" > "$OUT"
          fi

          echo "=== Combined coverage summary ==="
          go tool cover -func="$OUT" | tail -1

      - name: Upload combined coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: combined-coverage
          path: /tmp/combined-coverage.out
          retention-days: 7
          if-no-files-found: ignore

      - name: Collect logs and BPF debug info on failure
        if: failure()
        env:
          KUBECONFIG: /home/runner/.kube/k3s-e2e.yaml
        run: |
          echo "=== Kloak Controller Logs ==="
          kubectl logs -n kloak-system -l app.kubernetes.io/component=controller --tail=200 2>/dev/null || true
          echo "=== Kloak Webhook Logs ==="
          kubectl logs -n kloak-system -l app.kubernetes.io/component=webhook --tail=100 2>/dev/null || true
          echo "=== Demo App Logs ==="
          for app in demo-go demo-python demo-js demo-go-boring demo-python-raw-tls; do
            echo "--- $app ---"
            kubectl logs -n kloak-e2e -l app=$app --tail=50 2>/dev/null || true
          done
          echo "=== All Pods ==="
          kubectl get pods -A 2>/dev/null || true
          echo "=== Events ==="
          kubectl get events -n kloak-e2e --sort-by='.lastTimestamp' 2>/dev/null || true
          echo "=== Describe Controller ==="
          kubectl describe daemonset -n kloak-system kloak-controller 2>/dev/null || true
          echo "=== BPF Programs ==="
          sudo bpftool prog list 2>/dev/null || true
          echo "=== BPF Maps ==="
          sudo bpftool map list 2>/dev/null || true
          echo "=== Kernel dmesg (last 50 lines) ==="
          sudo dmesg | tail -50 2>/dev/null || true
          echo "=== BPF trace_pipe (buffered) ==="
          sudo timeout 2 cat /sys/kernel/tracing/trace_pipe 2>/dev/null | head -100 || true

      - name: Stop k3s
        if: always()
        run: |
          sudo /usr/local/bin/k3s-killall.sh 2>/dev/null || true
          sudo /usr/local/bin/k3s-uninstall.sh 2>/dev/null || true
          rm -f ~/.kube/k3s-e2e.yaml
