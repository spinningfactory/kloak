name: OpenSSL Versions Nightly

# Four jobs on an OpenSSL-version cadence, in one workflow:
#
#   0. resolve-matrix — fetch the latest stable patch per tracked minor from the
#                       GitHub releases API. Feeds discover and e2e so they always
#                       test the current upstream patch (e.g. 3.0.20, not the stale
#                       3.0.16 that was pinned when the row was first added). The
#                       nightly never needs hardcoded version strings updated — adding
#                       a new row to opensslOffsetTable (via detect-new-version) is
#                       enough for it to appear in the matrix automatically.
#   1. discover  — rebuild offset JSONs for every supported (OpenSSL, arch) cell
#                  and diff against the committed tools/openssl-offsets/results/.
#                  Catches struct-layout drift in patch releases.
#   2. e2e       — exercise demo-python-raw-tls end-to-end against every supported
#                  OpenSSL version. Catches BPF-interaction regressions that the
#                  unit tests (offset arithmetic only) cannot see.
#   3. watcher   — query GitHub releases for newly-released OpenSSL minor versions,
#                  run discovery + table updates for them, open a Dependabot-style PR.
#
# Runs daily at 07:00 UTC. Manual triggers via workflow_dispatch are also
# supported. fail-fast: false everywhere — one matrix cell flaking should not
# mask the others' results.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

concurrency:
  group: openssl-versions-nightly
  cancel-in-progress: false

env:
  GO_VERSION: '1.26'

jobs:
  # ────────────────────────────────────────────────────────────────────
  # (0) Resolve matrix — query GitHub releases for the latest stable patch
  # of each tracked minor so discover/e2e always exercise current upstream.
  resolve-matrix:
    name: Resolve latest patch versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve latest patch per tracked minor
        id: resolve
        run: |
          set -euo pipefail
          # All stable releases, newest-first. First occurrence of each major.minor
          # is the latest patch for that minor series.
          curl -fsS \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/openssl/openssl/releases?per_page=100" \
            | jq -r '.[] | select(.prerelease == false and .draft == false) | .tag_name' \
            | grep '^openssl-[0-9]' \
            | sed 's/^openssl-//' \
            | awk -F. '!seen[$1"."$2]++ { print }' > upstream-latest-by-minor.txt
          cat upstream-latest-by-minor.txt

          # Tracked minors derived from committed reference JSON filenames.
          ls tools/openssl-offsets/results/ \
            | sed -n 's/^openssl-\([0-9]*\.[0-9]*\)\.[0-9]*-amd64\.json$/\1/p' \
            | LC_ALL=C sort -u > tracked-minors.txt
          cat tracked-minors.txt

          # For each tracked minor, pick its latest upstream patch.
          versions=$(awk -F. '
            NR==FNR { latest[$1"."$2] = $0; next }
            { mm = $0; if (mm in latest) print latest[mm] }
          ' upstream-latest-by-minor.txt tracked-minors.txt \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | jq -R . | jq -sc .)
          echo "Resolved versions: $versions"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  # ────────────────────────────────────────────────────────────────────
  # (1) Offset discovery — same shape as openssl-offsets.yml's matrix,
  # but on a schedule. Diffs are surfaced as warnings so drift doesn't
  # block the nightly silently.
  discover:
    name: Discover ${{ matrix.openssl }} on ${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: [resolve-matrix]
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        openssl: ${{ fromJson(needs.resolve-matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute arch label
        id: arch
        run: |
          case "${{ matrix.platform }}" in
            linux/amd64) echo "arch=amd64" >> "$GITHUB_OUTPUT" ;;
            linux/arm64) echo "arch=arm64" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build discovery image
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --build-arg OPENSSL_VERSION=${{ matrix.openssl }} \
            --load \
            -t offsets:${{ matrix.openssl }}-${{ steps.arch.outputs.arch }} \
            tools/openssl-offsets/

      - name: Run discovery
        run: |
          mkdir -p out
          docker run --rm --platform ${{ matrix.platform }} \
            offsets:${{ matrix.openssl }}-${{ steps.arch.outputs.arch }} \
            > out/openssl-${{ matrix.openssl }}-${{ steps.arch.outputs.arch }}.json
          echo "=== discovered ==="
          cat out/openssl-${{ matrix.openssl }}-${{ steps.arch.outputs.arch }}.json

      - name: Diff against committed JSON
        run: |
          existing=tools/openssl-offsets/results/openssl-${{ matrix.openssl }}-${{ steps.arch.outputs.arch }}.json
          new=out/openssl-${{ matrix.openssl }}-${{ steps.arch.outputs.arch }}.json
          if [ ! -f "$existing" ]; then
            echo "::warning::no committed reference for OpenSSL ${{ matrix.openssl }} ${{ steps.arch.outputs.arch }}"
            exit 0
          fi
          if ! diff <(jq -S . "$existing") <(jq -S . "$new"); then
            echo "::warning::offsets drifted for OpenSSL ${{ matrix.openssl }} ${{ steps.arch.outputs.arch }} — review the artifact"
          fi

      - name: Upload result
        uses: actions/upload-artifact@v7
        with:
          name: openssl-offsets-${{ matrix.openssl }}-${{ steps.arch.outputs.arch }}
          path: out/openssl-${{ matrix.openssl }}-${{ steps.arch.outputs.arch }}.json
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────
  # (2) Multi-version e2e — exercises the real BPF rewrite path against a
  # demo-python-raw-tls image built against each supported OpenSSL version.
  e2e:
    name: e2e OpenSSL ${{ matrix.openssl }}
    runs-on: ubuntu-latest
    needs: [resolve-matrix, discover]
    strategy:
      fail-fast: false
      matrix:
        openssl: ${{ fromJson(needs.resolve-matrix.outputs.versions) }}
    permissions:
      contents: read
      packages: write
    env:
      CACHE_REPO: ghcr.io/${{ github.repository }}/cache
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install clang and bpftool for eBPF
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev
          KVER="$(uname -r)" && sudo apt-get install -y linux-tools-common "linux-tools-${KVER}" 2>/dev/null || true

      - name: Generate eBPF bindings
        run: KLOAK_TARGET_ARCH=x86 go generate ./pkg/ebpf/

      - name: Login to GHCR (for build cache)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install k3s
        run: |
          curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--write-kubeconfig-mode 644 --disable=traefik" sh -
          for i in $(seq 1 30); do
            sudo k3s kubectl get nodes -o name 2>/dev/null | grep -q . && break
            sleep 2
          done
          sudo k3s kubectl wait --for=condition=Ready node --all --timeout=120s
          mkdir -p ~/.kube
          sudo cp /etc/rancher/k3s/k3s.yaml ~/.kube/k3s-e2e.yaml
          sudo chown "$(id -u):$(id -g)" ~/.kube/k3s-e2e.yaml
          chmod 600 ~/.kube/k3s-e2e.yaml

      - name: Build kloak + demo-python-raw-tls (OpenSSL ${{ matrix.openssl }}) and import to k3s
        run: |
          CACHE=${{ env.CACHE_REPO }}

          docker buildx build --load \
            --cache-from type=registry,ref=${CACHE}:kloak \
            --cache-to type=registry,ref=${CACHE}:kloak,mode=max,ignore-error=true \
            --build-arg TARGETARCH=amd64 --build-arg COVER=1 --build-arg BPF_DEBUG=1 \
            -t kloak:e2e .

          # Per-version cache key so OpenSSL build layers don't thrash across cells.
          docker buildx build --load \
            --build-arg OPENSSL_VERSION=${{ matrix.openssl }} \
            --cache-from type=registry,ref=${CACHE}:demo-python-raw-tls-${{ matrix.openssl }} \
            --cache-to type=registry,ref=${CACHE}:demo-python-raw-tls-${{ matrix.openssl }},mode=max,ignore-error=true \
            -t kloak-demo-python-raw-tls:latest ./examples/demo-python-raw-tls/

          docker save kloak:e2e kloak-demo-python-raw-tls:latest \
            | sudo k3s ctr -n k8s.io images import -

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Start BPF trace capture
        run: |
          sudo touch /tmp/bpf-trace.log
          sudo chmod 666 /tmp/bpf-trace.log
          sudo nohup sh -c 'cat /sys/kernel/tracing/trace_pipe > /tmp/bpf-trace.log 2>&1' >/dev/null 2>&1 &
          echo $! | sudo tee /tmp/bpf-trace.pid >/dev/null
          sleep 1

      - name: Run TestEBPFRawTLSHostFiltering
        run: go test -v -timeout 600s -tags=e2e_ebpf -count=1 -run 'TestEBPFRawTLSHostFiltering' ./test/e2e/
        env:
          KUBECONFIG: /home/runner/.kube/k3s-e2e.yaml

      - name: Stop BPF trace capture
        if: always()
        run: |
          PID=$(cat /tmp/bpf-trace.pid 2>/dev/null) || true
          if [ -n "$PID" ]; then
            sudo kill "$PID" 2>/dev/null || true
          fi
          sudo pkill -f "cat /sys/kernel/tracing/trace_pipe" 2>/dev/null || true
          sudo chmod 666 /tmp/bpf-trace.log 2>/dev/null || true

      - name: Collect logs and BPF debug info on failure
        if: failure()
        env:
          KUBECONFIG: /home/runner/.kube/k3s-e2e.yaml
        run: |
          echo "=== Kloak Controller Logs ==="
          kubectl logs -n kloak-system -l app.kubernetes.io/component=controller --tail=5000 2>/dev/null || true
          echo "=== demo-python-raw-tls Logs ==="
          kubectl logs -n kloak-e2e -l app=demo-python-raw-tls --tail=200 2>/dev/null || true
          echo "=== BPF trace (last 500 lines) ==="
          if [ -s /tmp/bpf-trace.log ]; then
            grep -F kloak /tmp/bpf-trace.log | tail -500 || true
          fi

      - name: Upload BPF trace
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bpf-trace-openssl-${{ matrix.openssl }}
          path: /tmp/bpf-trace.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop k3s
        if: always()
        run: |
          sudo /usr/local/bin/k3s-killall.sh 2>/dev/null || true
          sudo /usr/local/bin/k3s-uninstall.sh 2>/dev/null || true
          rm -f ~/.kube/k3s-e2e.yaml

  # ────────────────────────────────────────────────────────────────────
  # (3) New-version watcher — diffs the OpenSSL GitHub release feed against
  # the minors we currently track. New minor releases trigger a discovery
  # build + apply-new-versions.sh + auto-PR.
  detect-new-version:
    name: Detect new OpenSSL versions
    runs-on: ubuntu-latest
    needs: [discover]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Find new minor versions
        id: find
        run: |
          set -euo pipefail
          # Latest stable patch per minor from GitHub releases (newest-first order,
          # so first occurrence of each major.minor is the latest patch).
          # MIN_VERSION below provides the lower bound — no major-version filter here
          # so future releases (4.x, ...) are detected automatically.
          curl -fsS \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/openssl/openssl/releases?per_page=100" \
            | jq -r '.[] | select(.prerelease == false and .draft == false) | .tag_name' \
            | grep '^openssl-[0-9]' \
            | sed 's/^openssl-//' \
            | awk -F. '!seen[$1"."$2]++ { print }' \
            | LC_ALL=C sort -u > upstream-latest.txt
          cat upstream-latest.txt

          # Tracked minors come from the committed reference JSON filenames.
          ls tools/openssl-offsets/results/ \
            | sed -n 's/^openssl-\([0-9]*\.[0-9]*\)\.[0-9]*-amd64\.json$/\1/p' \
            | LC_ALL=C sort -u > tracked-minors.txt
          cat tracked-minors.txt

          # MIN_VERSION: anything older is intentionally unsupported.
          MIN_VERSION="3.0"
          # New = in upstream but no committed reference for that major.minor.
          awk -v m="$MIN_VERSION" -F. '
            NR==FNR { tracked[$1"."$2]=1; next }
            {
              mm=$1"."$2
              split(m, mm_min, ".")
              cur  = $1 + $2/100
              lim  = mm_min[1] + mm_min[2]/100
              if (cur >= lim && !tracked[mm]) print $0
            }
          ' tracked-minors.txt upstream-latest.txt > new-versions.txt

          if [ -s new-versions.txt ]; then
            new=$(paste -sd, new-versions.txt)
            echo "new=$new" >> "$GITHUB_OUTPUT"
            echo "Found new OpenSSL versions: $new"
          else
            echo "new=" >> "$GITHUB_OUTPUT"
            echo "No new OpenSSL versions detected"
          fi

      - name: Discover offsets for each new version
        if: steps.find.outputs.new != ''
        run: |
          set -euo pipefail
          for v in $(echo "${{ steps.find.outputs.new }}" | tr ',' ' '); do
            for arch_pair in "linux/amd64:amd64" "linux/arm64:arm64"; do
              platform="${arch_pair%%:*}"
              arch="${arch_pair##*:}"
              docker buildx build --platform "$platform" \
                --build-arg OPENSSL_VERSION="$v" \
                --load -t "offsets:$v-$arch" tools/openssl-offsets/
              docker run --rm --platform "$platform" "offsets:$v-$arch" \
                > "tools/openssl-offsets/results/openssl-$v-$arch.json"
            done
          done

      - name: Patch table + workflow matrices
        if: steps.find.outputs.new != ''
        run: |
          tools/openssl-offsets/apply-new-versions.sh "${{ steps.find.outputs.new }}"

      - name: Open PR
        if: steps.find.outputs.new != ''
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(openssl): add offset support for OpenSSL ${{ steps.find.outputs.new }}"
          branch: auto/openssl-versions/${{ steps.find.outputs.new }}
          delete-branch: true
          title: "chore(openssl): add offset support for OpenSSL ${{ steps.find.outputs.new }}"
          labels: |
            automated
            openssl-versions
          body: |
            Automated by `.github/workflows/openssl-versions-nightly.yml`.

            New OpenSSL release(s) detected on GitHub: **${{ steps.find.outputs.new }}**.

            Changes in this PR:
            - New `tools/openssl-offsets/results/openssl-<v>-<arch>.json` per (version, arch).
            - New `opensslOffsetTable` entries in `pkg/ebpf/openssl_offsets.go`.
            - Updated matrix list in `.github/workflows/openssl-offsets.yml`.
            - (The nightly's `discover`/`e2e` matrix is resolved dynamically at runtime — no static version list to update there.)

            ### Reviewer checklist
            - [ ] Diff the JSONs — offsets in expected ranges, no null fields.
            - [ ] `go test ./pkg/ebpf -run TestOpenSSLOffsets` passes locally.
            - [ ] Chain type correct: WRLToEncCtx=0 means 3-hop (OpenSSL ≤3.1), non-zero means 4-hop (3.2+).
            - [ ] Spot-check that the on-demand `openssl-offsets.yml` workflow matrix is updated.

            Note: this PR is opened by the default `GITHUB_TOKEN`; CI may not auto-trigger on push.
            Push an empty commit or close-and-reopen the PR to kick the per-PR checks if needed.
