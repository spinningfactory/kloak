name: OpenSSL Offset Discovery

on:
  workflow_dispatch:
    inputs:
      openssl_version:
        description: 'OpenSSL version (e.g., 3.5.0). Leave empty for all.'
        required: false

jobs:
  discover:
    name: Discover Offsets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
        openssl:
          - "3.5.0"
          - "3.4.1"
          - "3.3.3"
          - "3.2.4"
          - "3.1.7"
          - "3.0.16"
          - "3.6.3"
          - "4.0.1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and run offset finder
        run: |
          ARCH="${{ matrix.platform }}"
          ARCH="${ARCH#linux/}"
          mkdir -p out
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --build-arg OPENSSL_VERSION=${{ matrix.openssl }} \
            --load \
            -t offsets:${{ matrix.openssl }}-${ARCH} \
            tools/openssl-offsets/
          docker run --rm --platform ${{ matrix.platform }} \
            offsets:${{ matrix.openssl }}-${ARCH} \
            | tee out/openssl-${{ matrix.openssl }}-${ARCH}.json

      - name: Diff against committed JSON
        run: |
          ARCH="${{ matrix.platform }}"
          ARCH="${ARCH#linux/}"
          NEW="out/openssl-${{ matrix.openssl }}-${ARCH}.json"
          COMMITTED="tools/openssl-offsets/results/openssl-${{ matrix.openssl }}-${ARCH}.json"
          if [ -f "${COMMITTED}" ]; then
            diff <(jq -S . "${COMMITTED}") <(jq -S . "${NEW}") \
              && echo "No drift detected for openssl-${{ matrix.openssl }}-${ARCH}" \
              || echo "::warning::Offset drift detected for openssl-${{ matrix.openssl }}-${ARCH} — update tools/openssl-offsets/results/ and opensslOffsetTable"
          else
            echo "No committed JSON for openssl-${{ matrix.openssl }}-${ARCH} (first run)"
          fi
          mkdir -p tools/openssl-offsets/results
          cp "${NEW}" "${COMMITTED}"

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: offsets-${{ matrix.openssl }}-${{ matrix.platform == 'linux/amd64' && 'x86_64' || 'aarch64' }}
          path: tools/openssl-offsets/results/
