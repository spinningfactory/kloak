name: OpenSSL Offset Discovery

on:
  workflow_dispatch:
    inputs:
      openssl_version:
        description: 'OpenSSL version (e.g., 3.5.0). Leave empty for all.'
        required: false

jobs:
  discover:
    name: Discover Offsets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
        openssl:
          - "3.5.0"
          - "3.4.1"
          - "3.3.3"
          - "3.2.4"
          - "3.1.7"
          - "3.0.16"
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and run offset finder
        run: |
          ARCH="${{ matrix.platform }}"
          ARCH="${ARCH#linux/}"
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --build-arg OPENSSL_VERSION=${{ matrix.openssl }} \
            --load \
            -t offsets:${{ matrix.openssl }}-${ARCH} \
            tools/openssl-offsets/
          docker run --rm --platform ${{ matrix.platform }} \
            offsets:${{ matrix.openssl }}-${ARCH} \
            | tee tools/openssl-offsets/results/openssl-${{ matrix.openssl }}-${ARCH}.json

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: offsets-${{ matrix.openssl }}-${{ matrix.platform == 'linux/amd64' && 'x86_64' || 'aarch64' }}
          path: tools/openssl-offsets/results/
