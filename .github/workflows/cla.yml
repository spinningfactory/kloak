name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: |
      (github.event_name == 'pull_request_target' && github.event.action != 'closed') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' || contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')))
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_TOKEN }}
        with:
          path-to-signatures: 'signatures.json'
          path-to-document: 'https://github.com/spinningfactory/kloak/blob/main/CLA.md'
          remote-repository-name: kloak-cla
          remote-organization-name: spinningfactory
          branch: main
          allowlist: dhiaayachi,dependabot[bot],github-actions[bot],claude
          custom-notsigned-prcomment: |
            Thank you for your contribution! Before we can merge this PR, you need to sign our [Contributor License Agreement](https://github.com/spinningfactory/kloak/blob/main/CLA.md).

            To sign, please add a comment to this PR with the following text:

            > I have read the CLA Document and I hereby sign the CLA.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA.'
