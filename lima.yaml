# Lima VM configuration for eBPF development
# Usage: limactl start --name=kloak lima.yaml

# Use Ubuntu for good eBPF support
images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"

# VM resources
cpus: 4
# vz never hands freed guest memory back to macOS (no free page reporting,
# and Lima doesn't drive the balloon), so the VM costs the host up to its
# full size, mostly in guest page cache. A smaller VM caps that, and the
# zram swap set up below absorbs build peaks instead of OOM-killing them.
memory: "3GiB"
disk: "20GiB"

# Mount the project directory
mounts:
  - location: "~"
    writable: true
  - location: "/tmp/lima"
    writable: true

# Provision script to install build dependencies
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      
      # Update packages
      apt-get update
      
      # Install core eBPF build dependencies (avoid kernel-version-specific packages)
      apt-get install -y \
        clang \
        llvm \
        libbpf-dev \
        build-essential \
        pkg-config \
        git \
        curl
      
      # Try to install linux-tools-common (provides bpftool) - may fail but continue
      apt-get install -y linux-tools-common || echo "linux-tools-common not available, skipping"
      
      # Install kernel-specific tools if available (ignore errors)
      apt-get install -y linux-tools-$(uname -r) linux-headers-$(uname -r) 2>/dev/null || \
        echo "Kernel-specific tools not available for $(uname -r), bpftool may not work"
      
      # Install Go
      GO_VERSION="1.26.2"
      ARCH=$(dpkg --print-architecture)
      if [ ! -d /usr/local/go ]; then
        echo "Installing Go ${GO_VERSION}..."
        curl -fsSL "https://golang.org/dl/go${GO_VERSION}.linux-${ARCH}.tar.gz" -o /tmp/go.tar.gz
        tar -C /usr/local -xzf /tmp/go.tar.gz
        rm /tmp/go.tar.gz
      fi
      
      # Create symlinks so go is available system-wide
      ln -sf /usr/local/go/bin/go /usr/local/bin/go
      ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt
      
      # Verify installations
      echo "=== Installed versions ==="
      go version
      clang --version | head -1
      echo "=== Provision complete ==="

  # Compressed swap in RAM (zram). Runs on every boot, so a kernel upgrade
  # gets its matching module. Pods don't swap: k3s sets failSwapOn=false and
  # the kubelet default swap behavior is NoSwap, so only k3s, containerd,
  # buildkit, builds and tests use it.
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail

      # The Ubuntu cloud kernel builds zram as a module but ships it in
      # linux-modules-extra (~120 MB).
      if ! modinfo zram >/dev/null 2>&1; then
        apt-get install -y "linux-modules-extra-$(uname -r)"
      fi
      if ! dpkg -s systemd-zram-generator >/dev/null 2>&1; then
        apt-get install -y systemd-zram-generator
      fi

      cat > /etc/systemd/zram-generator.conf <<'EOF'
      [zram0]
      zram-size = ram
      compression-algorithm = zstd
      EOF
      # Swap-in from RAM is cheap: read one page at a time.
      echo "vm.page-cluster = 0" > /etc/sysctl.d/99-zram.conf
      sysctl -p /etc/sysctl.d/99-zram.conf

      systemctl daemon-reload
      systemctl start systemd-zram-setup@zram0.service
      swapon --show

  # Install K3s (Single Node Cluster)
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      if [ ! -f /usr/local/bin/k3s ]; then
        echo "Installing K3s..."
        curl -sfL https://get.k3s.io | sh -s - --write-kubeconfig-mode 644 --disable traefik
      else
        echo "K3s already installed"
      fi

# Enable host resolver for DNS
hostResolver:
  enabled: true

# Forward SSH agent
ssh:
  forwardAgent: true

# Port forwarding for K3s API and services
portForwards:
  - guestPort: 6443
    hostPort: 6443
  # Forward common ports for Ingress/Services (NodePort range or LB)
  - guestPort: 30443
    hostPort: 30443

# Use vz (Virtualization.framework) for better performance on macOS
vmType: "vz"
rosetta:
  # Enable Rosetta for running x86_64 binaries on ARM64
  enabled: true
  binfmt: true
mountType: "virtiofs"
