syntax = "proto3";

package kloak.sync.v1;

option go_package = "github.com/spinningfactory/kloak/pkg/sync";

// SyncService provides secret synchronization between controller and agents.
service SyncService {
  // WatchSecrets streams secret updates from controller to agents.
  // Agents subscribe with optional namespace filter and receive all matching
  // secrets.
  rpc WatchSecrets(WatchSecretsRequest) returns (stream SecretEvent);
}

// WatchSecretsRequest configures the watch stream.
message WatchSecretsRequest {
  // Optional: only receive secrets for these namespaces.
  // Empty means all namespaces.
  repeated string namespaces = 1;

  // Optional: node name for filtering (future use).
  string node_name = 2;
}

// SecretEvent represents a change to a secret.
message SecretEvent {
  // Type of event.
  EventType type = 1;

  // The hash (kloak:xxx format).
  string hash = 2;

  // The secret value (only for ADD/UPDATE).
  string value = 3;

  // Allowed hosts for this secret.
  repeated string allowed_hosts = 4;

  // Namespace the secret belongs to.
  string namespace = 5;

  // Pod ID that owns this secret (if applicable).
  string pod_id = 6;
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_ADD = 1;
  EVENT_TYPE_UPDATE = 2;
  EVENT_TYPE_DELETE = 3;
  // Full sync - agent should replace all secrets.
  EVENT_TYPE_SYNC = 4;
}
