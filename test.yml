apiVersion: v1
kind: Pod
metadata:
  name: ubuntu
  labels:
    app: ubuntu
  annotations:
    getkloak.io/enabled: "true"
spec:
  volumes:
  - name: ella-token
    secret:
      secretName: ella-token
  containers:
  - name: ubuntu
    image: ubuntu:latest
    command: ["/bin/sleep", "3650d"]
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - name: ella-token
        readOnly: true
        mountPath: "/etc/ella-token"
  restartPolicy: Always
