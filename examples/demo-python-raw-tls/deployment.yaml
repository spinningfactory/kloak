# The TLS echo server runs in its own pod, as the remote end of a real
# connection would: kloak patches the record as it leaves the client's pod,
# and the real value never exists inside that pod. (Under a CNI that load
# balances Services at the socket, such as Cilium, a server in the client's
# own pod would be reached over the pod's loopback, which kloak does not
# patch.)
apiVersion: v1
kind: Service
metadata:
  name: tls
  labels:
    app: tls
spec:
  selector:
    app: demo-python-raw-tls-echo
  ports:
    - port: 8443
      targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-python-raw-tls-echo
  labels:
    app: demo-python-raw-tls-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-python-raw-tls-echo
  template:
    metadata:
      labels:
        app: demo-python-raw-tls-echo
    spec:
      containers:
        - name: echo-server
          image: kloak-demo-python-raw-tls:latest
          imagePullPolicy: Never
          command: ["python", "-u", "echo_server.py"]
          ports:
            - containerPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-python-raw-tls
  labels:
    app: demo-python-raw-tls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-python-raw-tls
  template:
    metadata:
      labels:
        app: demo-python-raw-tls
      annotations:
        getkloak.io/enabled: "true"
    spec:
      containers:
        - name: demo-app
          image: kloak-demo-python-raw-tls:latest
          imagePullPolicy: Never
          command: ["python", "-u", "app.py"]
          env:
            - name: SECRET_ALLOWED_FILE
              value: "/etc/secrets/allowed/api-key"
            - name: SECRET_BLOCKED_FILE
              value: "/etc/secrets/blocked/api-key"
            # Full Service name, not "tls": kloak only rewrites a secret on a
            # connection whose TLS SNI is the secret's getkloak.io/hosts value.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TARGET_HOST
              value: "tls.$(POD_NAMESPACE).svc.cluster.local"
            - name: REQUEST_INTERVAL
              value: "5"
          volumeMounts:
            - name: secret-allowed-vol
              mountPath: "/etc/secrets/allowed"
              readOnly: true
            - name: secret-blocked-vol
              mountPath: "/etc/secrets/blocked"
              readOnly: true
      volumes:
        - name: secret-allowed-vol
          secret:
            secretName: secret-allowed
        - name: secret-blocked-vol
          secret:
            secretName: secret-blocked
