apiVersion: v1
kind: Pod
metadata:
  name: demo-python
  namespace: default
  labels:
    app: demo-python
  annotations:
    # Enable Bouncer for this pod
    bouncer.io/enabled: "true"
spec:
  containers:
    - name: demo-app
      image: bouncer-demo-python:latest
      imagePullPolicy: Never
      env:
        - name: API_KEY
          value: "sk-secret-api-key-should-be-hashed"
        - name: TARGET_URL
          value: "https://httpbin.org/headers"
        - name: REQUEST_INTERVAL
          value: "30"
