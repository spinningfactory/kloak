apiVersion: v1
kind: Pod
metadata:
  name: demo-python
  labels:
    app: demo-python
  annotations:
    # Enable Bouncer for this pod
    bouncer.io/enabled: "true"
spec:
  containers:
    - name: demo-app
      image: bouncer-demo-python:latest
      imagePullPolicy: Never
      env:
        - name: API_KEY_FILE
          value: "/etc/secrets/api-key"
        - name: TARGET_URL
          value: "https://httpbin.org/headers"
        - name: REQUEST_INTERVAL
          value: "5"
      volumeMounts:
        - name: secret-vol
          mountPath: "/etc/secrets"
          readOnly: true
  volumes:
    - name: secret-vol
      secret:
        secretName: demo-secret
