# Example secrets file for `klor run`.
#
# Each entry under `secrets:` declares one real value that kloak's eBPF
# data plane will rewrite shadow placeholders to on outbound TLS. The
# child your klor invocation spawns only ever sees `kloak:<UUID>`
# placeholders — never the values below.
#
# Run with:
#
#   sudo klor run --secrets ./secrets.yaml -- \
#       curl -sk -H "Authorization: Bearer $API_KEY" https://api.example.com/
#
# Schema (full reference, every field annotated):
#
#   secrets:
#     - name: <human label>      # required; used only for logs/errors
#       value: <literal>         # one of value / valueFrom is required
#       valueFrom:               # indirection so this file stays committable
#         env: <ENV_VAR>         # reads the real value from your shell env
#       host: <hostname>         # optional; "" = rewrite on every host
#       port: <port>             # optional; "443" or "443/tcp"
#       inject:                  # required; at least one field
#         env: <ENV_VAR>         # child sees ENV_VAR=kloak:<UUID>
#         file: /abs/path        # shadow placeholder written here, 0o400

secrets:
  # 1. Simplest case: literal value, env-only injection, no host/port
  #    filter so the rewrite applies to every outbound TLS write.
  - name: api-key
    value: example-real-value-please-replace
    inject:
      env: API_KEY

  # 2. File injection: the shadow placeholder is written to disk (mode
  #    0o400) and the child reads it directly. Use for tools that take
  #    a `--credentials-file` style flag. The path must be absolute; the
  #    runtime mkdirs its parent if missing. Prod installs typically use
  #    /run/kloak/... (tmpfs, wiped on reboot) — switch to /tmp/kloak/...
  #    here so the example runs without sudo.
  - name: gcp-credentials
    value: example-gcp-json-blob-please-replace
    inject:
      file: /tmp/kloak/gcp-credentials.json

  # 3. Both env AND file. Some libraries fall back to a file when the
  #    env var is empty (or vice versa); declaring both removes the
  #    branch from your runtime config.
  - name: dual-injected
    value: example-dual-please-replace
    inject:
      env: DUAL_TOKEN
      file: /tmp/kloak/dual-token
