# The TLS echo server runs in its own pod, as the remote end of a real
# connection would: kloak patches the record as it leaves the client's pod.
# (Under a CNI that load balances Services at the socket, such as Cilium, a
# server in the client's own pod would be reached over the pod's loopback,
# which kloak does not patch.)
apiVersion: v1
kind: Service
metadata:
  name: tls-bun
  labels:
    app: tls-bun
spec:
  selector:
    app: demo-bun-echo
  ports:
    - port: 8443
      targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-bun-echo
  labels:
    app: demo-bun-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-bun-echo
  template:
    metadata:
      labels:
        app: demo-bun-echo
    spec:
      containers:
        # Raw TLS echo server: reuses the demo-python-raw-tls image, which
        # bundles a self-signed cert and echoes whatever it receives.
        - name: echo-server
          image: kloak-demo-python-raw-tls:latest
          imagePullPolicy: Never
          command: ["python", "-u", "echo_server.py"]
          ports:
            - containerPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-bun
  labels:
    app: demo-bun
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-bun
  template:
    metadata:
      labels:
        app: demo-bun
      annotations:
        getkloak.io/enabled: "true"
    spec:
      containers:
        # Bun TypeScript client: connects to the echo Service via raw TLS using
        # Bun's built-in TLS stack (BoringSSL statically linked). SSL_write is
        # the uprobe target; kloak attaches via pre-computed file offset since
        # the Bun binary has no exported symbols.
        - name: demo-app
          image: kloak-demo-bun:latest
          imagePullPolicy: Never
          env:
            - name: SECRET_ALLOWED_FILE
              value: "/etc/secrets/allowed/api-key"
            - name: SECRET_BLOCKED_FILE
              value: "/etc/secrets/blocked/api-key"
            # Full Service name, not "tls-bun": kloak only rewrites a secret on a
            # connection whose TLS SNI is the secret's getkloak.io/hosts value.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TARGET_HOST
              value: "tls-bun.$(POD_NAMESPACE).svc.cluster.local"
            - name: REQUEST_INTERVAL
              value: "5"
          volumeMounts:
            - name: secret-allowed-vol
              mountPath: "/etc/secrets/allowed"
              readOnly: true
            - name: secret-blocked-vol
              mountPath: "/etc/secrets/blocked"
              readOnly: true
      volumes:
        - name: secret-allowed-vol
          secret:
            secretName: secret-allowed
        - name: secret-blocked-vol
          secret:
            secretName: secret-blocked
