# The TLS echo server runs in its own pod, as the remote end of a real
# connection would: kloak patches the record as it leaves the client's pod.
# (Under a CNI that load balances Services at the socket, such as Cilium, a
# server in the client's own pod would be reached over the pod's loopback,
# which kloak does not patch.)
apiVersion: v1
kind: Service
metadata:
  name: tls-bun-claude
  labels:
    app: tls-bun-claude
spec:
  selector:
    app: demo-bun-claude-echo
  ports:
    - port: 8443
      targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-bun-claude-echo
  labels:
    app: demo-bun-claude-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-bun-claude-echo
  template:
    metadata:
      labels:
        app: demo-bun-claude-echo
    spec:
      containers:
        # HTTP-over-TLS echo server: returns request headers as JSON at GET
        # /echo. The same image used by cipher_test.go and dns_whitelist_test.go.
        - name: echo-server
          image: kloak-tls-echo:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8443
          readinessProbe:
            httpGet:
              path: /health
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 2
            periodSeconds: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-bun-claude
  labels:
    app: demo-bun-claude
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-bun-claude
  template:
    metadata:
      labels:
        app: demo-bun-claude
      annotations:
        getkloak.io/enabled: "true"
    spec:
      containers:
        # Bun TypeScript client mimicking Claude Code: uses fetch() to send
        # API requests with the secret in an Authorization: Bearer header.
        # kloak attaches to SSL_write via file offset (no exported symbols in
        # the stripped Bun binary) and rewrites the shadow key on the wire.
        - name: demo-app
          image: kloak-demo-bun:latest
          imagePullPolicy: Never
          command: ["/usr/local/bin/bun", "run", "main-claude.ts"]
          env:
            - name: SECRET_API_KEY_FILE
              value: "/etc/secrets/allowed/api-key"
            - name: SECRET_BLOCKED_KEY_FILE
              value: "/etc/secrets/blocked/api-key"
            # Full Service name, not "tls-bun-claude": kloak only rewrites a secret on a
            # connection whose TLS SNI is the secret's getkloak.io/hosts value.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TARGET_HOST
              value: "tls-bun-claude.$(POD_NAMESPACE).svc.cluster.local"
            - name: REQUEST_INTERVAL
              value: "5"
          volumeMounts:
            - name: secret-allowed-vol
              mountPath: "/etc/secrets/allowed"
              readOnly: true
            - name: secret-blocked-vol
              mountPath: "/etc/secrets/blocked"
              readOnly: true
      volumes:
        - name: secret-allowed-vol
          secret:
            secretName: secret-allowed
        - name: secret-blocked-vol
          secret:
            secretName: secret-blocked
