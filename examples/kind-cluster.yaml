# Kind cluster configuration for Bouncer demo
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: bouncer-demo
nodes:
  - role: control-plane
    # Expose webhook port
    extraPortMappings:
      - containerPort: 30443
        hostPort: 30443
        protocol: TCP
    # Mount cgroups v2 for eBPF
    extraMounts:
      - hostPath: /sys/fs/cgroup
        containerPath: /sys/fs/cgroup
        readOnly: false
