# Kloak E2E Test Overlay
# Inherits base manifests with eBPF enabled (privileged, BPF/BTF volumes).
# Sets GOCOVERDIR for integration test coverage collection.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../manifests

patches:
  # Add GOCOVERDIR env var and hostPath volume for coverage data.
  # hostPath persists coverage files after the controller exits
  # (DaemonSet restart would overwrite in-container /tmp/coverage).
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: GOCOVERDIR
          value: /coverage
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: coverage
          mountPath: /coverage
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: coverage
          hostPath:
            path: /tmp/kloak-coverage
            type: DirectoryOrCreate
    target:
      kind: DaemonSet
      name: kloak-controller

images:
  - name: kloak
    newName: kloak
    newTag: e2e
  - name: bitnami/kubectl
    newName: bitnami/kubectl
    newTag: latest
