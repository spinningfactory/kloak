# Kloak Production Overlay
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../manifests

# Production-specific patches
patches:
  # Enable eBPF
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - --enable-ebpf=true
          - --cgroup-path=/host/sys/fs/cgroup
    target:
      kind: DaemonSet
      name: kloak-controller

  # Increase resource limits for production
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          limits:
            cpu: "1"
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
    target:
      kind: DaemonSet
      name: kloak-controller

# Production images from registry
images:
  - name: kloak
    newName: ghcr.io/your-org/kloak
    newTag: v1.0.0
  - name: bitnami/kubectl
    newName: bitnami/kubectl
    newTag: latest
