# Envoy Bootstrap Configuration using xDS
# Points to Kloak Controller for dynamic configuration (LDS/SDS)

admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 15000

dynamic_resources:
  lds_config:
    resource_api_version: V3
    api_config_source:
      api_type: GRPC
      transport_api_version: V3
      grpc_services:
        - envoy_grpc:
            cluster_name: xds_cluster
  cds_config:
    resource_api_version: V3
    api_config_source:
      api_type: GRPC
      transport_api_version: V3
      grpc_services:
        - envoy_grpc:
            cluster_name: xds_cluster

static_resources:
  clusters:
  # Management Server for LDS/CDS/ADS
  - name: xds_cluster
    connect_timeout: 10s
    type: STRICT_DNS # Use STRICT_DNS or LOGICAL_DNS for k8s service
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    load_assignment:
      cluster_name: xds_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: kloak-controller.kloak-system.svc
                port_value: 15002

  # Management Server for SDS (referenced by LDS config)
  - name: sds_server
    connect_timeout: 10s
    type: STRICT_DNS
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    load_assignment:
      cluster_name: sds_server
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: kloak-controller.kloak-system.svc
                port_value: 15002

  # Dynamic Forward Proxy Cluster (specific config requirement)
  - name: dynamic_forward_proxy_cluster
    lb_policy: CLUSTER_PROVIDED
    cluster_type:
      name: envoy.clusters.dynamic_forward_proxy
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
        dns_cache_config:
          name: dynamic_forward_proxy_cache_config
          dns_lookup_family: V4_ONLY
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        common_tls_context:
          validation_context:
            trusted_ca:
              filename: /etc/ssl/certs/ca-certificates.crt

  # External Processing Server (referenced by Listener filter)
  # Note: This cluster name 'ext_proc_server' must match what's in the Listener config (if static)
  # But our new LDS generates the listener dynamically.
  # If the LDS config references 'ext_proc_server', we need it here OR provided via CDS.
  # For safety, let's keep it here, as we are not implementing dynamic CDS yet (CDS relies on ADS/CDS).
  # Wait, pkg/lds/listener.go doesn't seem to add ExtProc filter in the CURRENT MakeListener implementation?
  # Let me double check pkg/lds/listener.go content.
  # ...
  # I checked pkg/lds/listener.go earlier. It adds:
  # 1. TlsInspector
  # 2. HCM with Dynamic Forward Proxy and Router.
  # IT DOES NOT ADD EXT_PROC in the current code I wrote!
  # Use request was "continue implementing the plan for LDS and SDS".
  # The original file pkg/lds/listener.go I wrote has DFP and Router.
  # The previous envoy.yaml HAD ExtProc.
  # If I drop ExtProc, I lose functionality (unhashing).
  # I should update pkg/lds/listener.go to include ExtProc if I want feature parity.
  # For now, I will include the cluster definition here just in case.
  - name: ext_proc_server
    connect_timeout: 1s
    type: STRICT_DNS
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    load_assignment:
      cluster_name: ext_proc_server
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: kloak-controller.kloak-system.svc
                port_value: 15002
