apiVersion: apps/v1
kind: Deployment
metadata:
  name: kloak-webhook
  namespace: kloak-system
  labels:
    app.kubernetes.io/name: kloak
    app.kubernetes.io/component: webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kloak
      app.kubernetes.io/component: webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kloak
        app.kubernetes.io/component: webhook
    spec:
      serviceAccountName: kloak-controller
      # Wait for controller to create TLS certs before starting webhook
      initContainers:
        - name: wait-for-certs
          image: bitnami/kubectl:latest
          command:
            - sh
            - -c
            - |
              echo "Waiting for webhook TLS certificate secret..."
              until kubectl get secret kloak-webhook-certs -n kloak-system 2>/dev/null; do
                echo "Secret not found, waiting..."
                sleep 2
              done
              echo "TLS certificate secret found!"
      containers:
        - name: webhook
          image: kloak:latest
          imagePullPolicy: IfNotPresent
          command: ["/kloak", "webhook"]
          args:
            - --cert-dir=/certs
          ports:
            - name: webhook
              containerPort: 9443
            - name: health
              containerPort: 8081
          volumeMounts:
            - name: webhook-certs
              mountPath: /certs
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
      volumes:
        - name: webhook-certs
          secret:
            secretName: kloak-webhook-certs
---
apiVersion: v1
kind: Service
metadata:
  name: kloak-webhook
  namespace: kloak-system
  labels:
    app.kubernetes.io/name: kloak
    app.kubernetes.io/component: webhook
spec:
  ports:
    - port: 443
      targetPort: webhook
      protocol: TCP
  selector:
    app.kubernetes.io/name: kloak
    app.kubernetes.io/component: webhook
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: kloak-mutating-webhook
  labels:
    app.kubernetes.io/name: kloak
webhooks:
  - name: pod.mutate.getkloak.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    clientConfig:
      service:
        namespace: kloak-system
        name: kloak-webhook
        path: /mutate-pods
      # CA bundle injected by cert-manager or manually
      caBundle: ""
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
    namespaceSelector:
      matchExpressions:
        - key: getkloak.io/enabled
          operator: In
          values: ["true"]
    failurePolicy: Fail
