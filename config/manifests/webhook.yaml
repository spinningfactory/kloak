apiVersion: apps/v1
kind: Deployment
metadata:
  name: bouncer-webhook
  namespace: bouncer-system
  labels:
    app.kubernetes.io/name: bouncer
    app.kubernetes.io/component: webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bouncer
      app.kubernetes.io/component: webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bouncer
        app.kubernetes.io/component: webhook
    spec:
      serviceAccountName: bouncer-controller
      containers:
        - name: webhook
          image: bouncer:latest
          imagePullPolicy: IfNotPresent
          command: ["/bouncer", "webhook"]
          args:
            - --cert-dir=/certs
            - --hash-envs=API_KEY,SECRET_KEY,PASSWORD,TOKEN,OPENAI_API_KEY
          ports:
            - name: webhook
              containerPort: 9443
            - name: health
              containerPort: 8081
          volumeMounts:
            - name: webhook-certs
              mountPath: /certs
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
      volumes:
        - name: webhook-certs
          secret:
            secretName: bouncer-webhook-certs
---
apiVersion: v1
kind: Service
metadata:
  name: bouncer-webhook
  namespace: bouncer-system
  labels:
    app.kubernetes.io/name: bouncer
    app.kubernetes.io/component: webhook
spec:
  ports:
    - port: 443
      targetPort: webhook
      protocol: TCP
  selector:
    app.kubernetes.io/name: bouncer
    app.kubernetes.io/component: webhook
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: bouncer-mutating-webhook
  labels:
    app.kubernetes.io/name: bouncer
webhooks:
  - name: pod.mutate.bouncer.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    clientConfig:
      service:
        namespace: bouncer-system
        name: bouncer-webhook
        path: /mutate-pods
      # CA bundle injected by cert-manager or manually
      caBundle: ""
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
    namespaceSelector:
      matchExpressions:
        - key: bouncer.io/enabled
          operator: In
          values: ["true"]
    failurePolicy: Ignore
