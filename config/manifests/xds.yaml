apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: bouncer-xds
  namespace: bouncer-system
  labels:
    app.kubernetes.io/name: bouncer
    app.kubernetes.io/component: xds
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: bouncer
      app.kubernetes.io/component: xds
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bouncer
        app.kubernetes.io/component: xds
    spec:
      serviceAccountName: bouncer-controller
      hostNetwork: true
      containers:
        - name: xds
          image: bouncer:latest
          imagePullPolicy: IfNotPresent
          command: ["/bouncer", "xds"]
          args:
            - --addr=:15002
          ports:
            - name: sds
              containerPort: 15002
              hostPort: 15002
            - name: extproc
              containerPort: 15003
              hostPort: 15003
          volumeMounts:
            - name: bouncer-ca
              mountPath: /etc/bouncer/ca
              readOnly: true
          resources:
            limits:
              cpu: 200m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
      volumes:
        - name: bouncer-ca
          secret:
            secretName: bouncer-ca
