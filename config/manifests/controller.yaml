apiVersion: apps/v1
kind: Deployment
metadata:
  name: kloak-controller
  namespace: kloak-system
  labels:
    app.kubernetes.io/name: kloak
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kloak
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kloak
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: kloak-controller
      hostPID: true  # Required for cgroup access
      containers:
        - name: controller
          image: kloak:latest
          imagePullPolicy: IfNotPresent
          command: ["/kloak", "controller"]
          args:
            - --leader-elect=true
            - --enable-ebpf=true
            - --cgroup-path=/host/sys/fs/cgroup
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
            - name: http-store
              containerPort: 8090
            - name: grpc-xds
              containerPort: 15002
          volumeMounts:
            - name: cgroup
              mountPath: /host/sys/fs/cgroup
              readOnly: false
            - name: bpf
              mountPath: /sys/fs/bpf
              readOnly: false
            - name: btf
              mountPath: /sys/kernel/btf
              readOnly: true
            - name: ca-certs
              mountPath: /etc/kloak/ca
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            privileged: true  # Required for eBPF
            runAsGroup: 0 
            runAsUser: 0 
            appArmorProfile:
              type: Unconfined
            capabilities:
              add:
                - BPF
                - NET_ADMIN
                - SYS_ADMIN
                - SYS_RESOURCE
      volumes:
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: bpf
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: btf
          hostPath:
            path: /sys/kernel/btf
            type: Directory
        - name: ca-certs
          secret:
            secretName: kloak-ca

---
apiVersion: v1
kind: Service
metadata:
  name: kloak-controller
  namespace: kloak-system
  labels:
    app.kubernetes.io/name: kloak
    app.kubernetes.io/component: controller
spec:
  ports:
    - name: https-metrics
      port: 8443
      targetPort: 8443
      protocol: TCP
    - name: http-store
      port: 8090
      targetPort: 8090
      protocol: TCP
    - name: grpc-xds
      port: 15002
      targetPort: 15002
      protocol: TCP
  selector:
    app.kubernetes.io/name: kloak
    app.kubernetes.io/component: controller
