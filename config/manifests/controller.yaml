apiVersion: apps/v1
kind: Deployment
metadata:
  name: bouncer-controller
  namespace: bouncer-system
  labels:
    app.kubernetes.io/name: bouncer
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bouncer
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bouncer
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: bouncer-controller
      containers:
        - name: controller
          image: bouncer:latest
          imagePullPolicy: IfNotPresent
          command: ["/bouncer", "controller"]
          args:
            - --leader-elect=true
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
