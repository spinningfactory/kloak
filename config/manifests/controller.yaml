apiVersion: apps/v1
kind: Deployment
metadata:
  name: bouncer-controller
  namespace: bouncer-system
  labels:
    app.kubernetes.io/name: bouncer
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bouncer
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bouncer
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: bouncer-controller
      hostPID: true  # Required for cgroup access
      containers:
        - name: controller
          image: bouncer:latest
          imagePullPolicy: IfNotPresent
          command: ["/bouncer", "controller"]
          args:
            - --leader-elect=true
            - --enable-ebpf=true
            - --cgroup-path=/host/sys/fs/cgroup
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          volumeMounts:
            - name: cgroup
              mountPath: /host/sys/fs/cgroup
              readOnly: false
            - name: bpf
              mountPath: /sys/fs/bpf
              readOnly: false
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            privileged: true  # Required for eBPF
            runAsGroup: 0 
            runAsUser: 0 
            appArmorProfile:
              type: Unconfined
            capabilities:
              add:
                - BPF
                - NET_ADMIN
                - SYS_ADMIN
                - SYS_RESOURCE
      volumes:
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: bpf
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
