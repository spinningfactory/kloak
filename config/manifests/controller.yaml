apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kloak-controller
  namespace: kloak-system
  labels:
    app.kubernetes.io/name: kloak
    app.kubernetes.io/component: controller
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kloak
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kloak
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: kloak-controller
      hostPID: true  # Required for cgroup access
      containers:
        - name: controller
          image: kloak:latest
          imagePullPolicy: IfNotPresent
          command: ["/kloak", "controller"]
          args:
            - --enable-ebpf=true
            - --cgroup-path=/host/sys/fs/cgroup
          env:

            # Node name for filtering pods to only those on this node
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
            - name: http-store
              containerPort: 8090
            - name: grpc-sync
              containerPort: 9090
          volumeMounts:
            - name: cgroup
              mountPath: /host/sys/fs/cgroup
              readOnly: false
            - name: bpf
              mountPath: /sys/fs/bpf
              readOnly: false
            - name: btf
              mountPath: /sys/kernel/btf
              readOnly: true

          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            privileged: true  # Required for eBPF
            runAsGroup: 0 
            runAsUser: 0 
            appArmorProfile:
              type: Unconfined
            capabilities:
              add:
                - BPF
                - NET_ADMIN
                - SYS_ADMIN
                - SYS_RESOURCE
      volumes:
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: bpf
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: btf
          hostPath:
            path: /sys/kernel/btf
            type: Directory

---
apiVersion: v1
kind: Service
metadata:
  name: kloak-controller
  namespace: kloak-system
  labels:
    app.kubernetes.io/name: kloak
    app.kubernetes.io/component: controller
spec:
  # Headless service since each node has its own controller
  clusterIP: None
  ports:
    - name: http-store
      port: 8090
      targetPort: 8090
      protocol: TCP
    - name: grpc-sync
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app.kubernetes.io/name: kloak
    app.kubernetes.io/component: controller
