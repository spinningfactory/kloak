apiVersion: v1
kind: Namespace
metadata:
  name: kloak-system
  labels:
    app.kubernetes.io/name: kloak
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kloak-controller
  namespace: kloak-system
  labels:
    app.kubernetes.io/name: kloak
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kloak-controller
  labels:
    app.kubernetes.io/name: kloak
rules:
  # Pod watching for controller
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Secret management for SecretReconciler
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Events for debugging
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Leases for leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # MutatingWebhookConfiguration for auto cert mode
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kloak-controller
  labels:
    app.kubernetes.io/name: kloak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kloak-controller
subjects:
  - kind: ServiceAccount
    name: kloak-controller
    namespace: kloak-system
