apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kloak-agent
  namespace: kloak-system
  labels:
    app.kubernetes.io/name: kloak
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kloak
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kloak
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: kloak-controller
      containers:
        - name: agent
          image: kloak:latest
          imagePullPolicy: IfNotPresent
          command: ["/kloak", "agent"]
          args:
            - --controller-addr=kloak-controller.$(POD_NAMESPACE).svc:9090
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

          volumeMounts:
            - name: run-kloak
              mountPath: /run/kloak
            - name: sys-fs-cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
          livenessProbe:
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            privileged: true  # Required for eBPF
            runAsGroup: 0 
            runAsUser: 0 
            appArmorProfile:
              type: Unconfined
            capabilities:
              add:
                - BPF
                - NET_ADMIN
                - SYS_ADMIN
                - SYS_RESOURCE
      volumes:
        - name: run-kloak
          hostPath:
            path: /run/kloak
            type: DirectoryOrCreate
        - name: sys-fs-cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: kloak-agent
  namespace: kloak-system
  labels:
    app.kubernetes.io/name: kloak
    app.kubernetes.io/component: agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kloak
    app.kubernetes.io/component: agent
