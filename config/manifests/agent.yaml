apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kloak-agent
  namespace: kloak-system
  labels:
    app.kubernetes.io/name: kloak
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kloak
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kloak
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: kloak-controller
      initContainers:
        - name: wait-for-ca
          image: bitnami/kubectl:latest
          command:
            - sh
            - -c
            - |
              echo "Waiting for CA secret..."
              until kubectl get secret kloak-ca -n kloak-system 2>/dev/null; do
                echo "Secret not found, waiting..."
                sleep 2
              done
              echo "CA secret found!"
      containers:
        - name: agent
          image: kloak:latest
          imagePullPolicy: IfNotPresent
          command: ["/kloak", "agent"]
          args:
            - --xds-addr=:15002
            - --controller-addr=kloak-controller.kloak-system.svc:9090
          ports:
            - name: grpc-xds
              containerPort: 15002
              protocol: TCP
          volumeMounts:
            - name: ca-certs
              mountPath: /etc/kloak/ca
              readOnly: true
            - name: run-kloak
              mountPath: /run/kloak
            - name: sys-fs-cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
          livenessProbe:
            grpc:
              port: 15002
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            grpc:
              port: 15002
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            privileged: true  # Required for eBPF
            runAsGroup: 0 
            runAsUser: 0 
            appArmorProfile:
              type: Unconfined
            capabilities:
              add:
                - BPF
                - NET_ADMIN
                - SYS_ADMIN
                - SYS_RESOURCE
      volumes:
        - name: ca-certs
          secret:
            secretName: kloak-ca
            optional: true
        - name: run-kloak
          hostPath:
            path: /run/kloak
            type: DirectoryOrCreate
        - name: sys-fs-cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: kloak-agent
  namespace: kloak-system
  labels:
    app.kubernetes.io/name: kloak
    app.kubernetes.io/component: agent
spec:
  # Use ClusterIP for internal communication from Envoy sidecars
  type: ClusterIP
  ports:
    - name: grpc-xds
      port: 15002
      targetPort: 15002
      protocol: TCP
  selector:
    app.kubernetes.io/name: kloak
    app.kubernetes.io/component: agent
