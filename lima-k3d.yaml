# Lima VM configuration for running k3d (k3s in Docker) on ARM Mac
# Usage: limactl start --name=kloak-k3d lima-k3d.yaml
#        limactl shell kloak-k3d -- make e2e-setup
#        limactl shell kloak-k3d -- make e2e-run

images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"

cpus: 4
memory: "8GiB"
disk: "30GiB"

mounts:
  - location: "~"
    writable: true
  - location: "/tmp/lima"
    writable: true

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail

      apt-get update

      # Install eBPF build dependencies
      apt-get install -y \
        clang \
        llvm \
        libbpf-dev \
        build-essential \
        pkg-config \
        git \
        curl \
        jq

      # Install kernel tools for bpftool
      apt-get install -y linux-tools-common || true
      apt-get install -y linux-tools-$(uname -r) linux-headers-$(uname -r) 2>/dev/null || true

      # Install Go
      GO_VERSION="1.25.1"
      ARCH=$(dpkg --print-architecture)
      if [ ! -d /usr/local/go ]; then
        curl -fsSL "https://golang.org/dl/go${GO_VERSION}.linux-${ARCH}.tar.gz" -o /tmp/go.tar.gz
        tar -C /usr/local -xzf /tmp/go.tar.gz
        rm /tmp/go.tar.gz
      fi
      ln -sf /usr/local/go/bin/go /usr/local/bin/go
      ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt

      # Install Docker
      if ! command -v docker &>/dev/null; then
        curl -fsSL https://get.docker.com | sh
        usermod -aG docker "${LIMA_CIDATA_USER:-$(id -un 1000)}"
      fi

      # Install k3d
      if ! command -v k3d &>/dev/null; then
        curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
      fi

      # Install kubectl
      if ! command -v kubectl &>/dev/null; then
        ARCH=$(dpkg --print-architecture)
        curl -fsSL "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/${ARCH}/kubectl" -o /usr/local/bin/kubectl
        chmod +x /usr/local/bin/kubectl
      fi

      # Install Helm
      if ! command -v helm &>/dev/null; then
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      fi

      echo "=== Installed versions ==="
      go version
      docker --version
      k3d version
      kubectl version --client
      helm version --short

hostResolver:
  enabled: true

ssh:
  forwardAgent: true

portForwards:
  - guestPort: 6443
    hostPort: 6443

vmType: "vz"
